<script>
"use strict";
/* =========================================================================

   Sistema de Contabilidad, Inventario y Facturación en Tiempo Real

   ========================================================================= */

/* ---- Constantes ---- */
const SUPABASE_URL     = 'https://zgpunnvzircazykgecex.supabase.co';
const SUPABASE_ANON    = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpncHVubnZ6aXJjYXp5a2dlY2V4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNjQ4ODksImV4cCI6MjEwMTk0MDg4OX0.3o2X3HuV8z0txIDmr01fXm1OesUz4wgBDK56S4CrQCU';
const SESSION_KEY      = 'pvf_session_v1';
const BCV_ENDPOINT     = 'https://ve.dolarapi.com/v1/dolares/oficial';
const RATE_REFRESH_MS  = 15 * 60 * 1000;
const DEFAULT_MARKUP   = 7;

/* ---- Cliente Supabase ---- */
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

/* ---- Utilidades ---- */
function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normalize(s){ return String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s.]/g,' ').replace(/\s+/g,' ').trim(); }
function fmtUSD(n){ return '$' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtBs(n){ if(n === null || n === undefined || isNaN(n)) return '—'; return 'Bs. ' + Number(n).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtQty(n){ const v = parseFloat(n||0); return Number.isInteger(v) ? v.toString() : v.toLocaleString('es-VE',{minimumFractionDigits:1,maximumFractionDigits:2}); }
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function getLocalYYYYMMDD(isoStr){
  if(!isoStr) return todayStr();
  try{
    const d = new Date(isoStr);
    if(isNaN(d.getTime())) return isoStr.slice(0,10);
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }catch(e){
    return isoStr.slice(0,10);
  }
}
function fmtDateShort(iso){ try{ return new Date(iso).toLocaleDateString('es-VE',{ day:'2-digit', month:'short', year:'numeric' }); }catch(e){ return iso; } }
function fmtDateTime(iso){ try{ return new Date(iso).toLocaleString('es-VE',{ day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }); }catch(e){ return iso; } }
function fmtTime(iso){ try{ return new Date(iso).toLocaleTimeString('es-VE',{ hour:'2-digit', minute:'2-digit' }); }catch(e){ return ''; } }
function debounce(fn, ms){ let t=null; return function(...args){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,args), ms); }; }
function toUpper(s){ return String(s||'').toUpperCase(); }

const CATEGORY_THEMES = [
  {bg:'bg-amber-500/15', text:'text-amber-300', ring:'ring-amber-500/30'},
  {bg:'bg-sky-500/15',   text:'text-sky-300',   ring:'ring-sky-500/30'},
  {bg:'bg-emerald-500/15',text:'text-emerald-300',ring:'ring-emerald-500/30'},
  {bg:'bg-violet-500/15',text:'text-violet-300',ring:'ring-violet-500/30'},
  {bg:'bg-rose-500/15',  text:'text-rose-300',  ring:'ring-rose-500/30'},
  {bg:'bg-teal-500/15',  text:'text-teal-300',  ring:'ring-teal-500/30'},
  {bg:'bg-indigo-500/15',text:'text-indigo-300',ring:'ring-indigo-500/30'},
  {bg:'bg-orange-500/15',text:'text-orange-300',ring:'ring-orange-500/30'},
];
function categoryTheme(cat){ let h=0; const s=String(cat||''); for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return CATEGORY_THEMES[h%CATEGORY_THEMES.length]; }
function categoryBadge(cat){ const t=categoryTheme(cat); return `<span class="badge ${t.bg} ${t.text} ring-1 ${t.ring}">${esc(cat)}</span>`; }

/* =========================================================================
   GENERADOR AUTOMÁTICO DE CÓDIGOS SKU (MÁXIMO 6 CARACTERES)
   ========================================================================= */
function generateProductCode(category, name) {
  const normCat = normalize(category);
  const normName = normalize(name);

  let prefix = 'PRD';
  if (normCat.includes('arena') || normName.includes('arena')) prefix = 'ARE';
  else if (normCat.includes('piedra') || normName.includes('piedra')) prefix = 'PIE';
  else if (normCat.includes('polvillo') || normName.includes('polvillo')) prefix = 'POL';
  else if (normCat.includes('cal') || normName.includes('cal')) prefix = 'CAL';
  else if (normCat.includes('latex') || normName.includes('latex')) prefix = 'LAT';
  else if (normCat.includes('esmalte') || normName.includes('esmalte')) prefix = 'ESM';
  else if (normCat.includes('base') || normCat.includes('anticorrosivo')) prefix = 'BAS';
  else if (normCat.includes('caucho') || normName.includes('caucho')) prefix = 'CAU';
  else if (normCat.includes('solvente') || normCat.includes('thinner')) prefix = 'SOL';
  else if (normCat.includes('accesorio') || normName.includes('brocha')) prefix = 'ACC';
  else if (normCat.includes('preparacion') || normName.includes('masilla')) prefix = 'PRE';
  else if (normCat.includes('especial') || normName.includes('trafico')) prefix = 'ESP';
  else if (normCat.includes('material') || normCat.includes('construccion')) prefix = 'MAT';
  else {
    const clean = category.trim().replace(/[^a-zA-Z]/g,'').toUpperCase();
    if(clean.length >= 3) prefix = clean.slice(0,3);
  }

  const existingCodes = new Set(DB.getProducts().map(p => (p.codigo||'').toUpperCase()));
  let num = Math.floor(Math.random() * 899 + 100);
  let generated = `${prefix}${String(num).padStart(3,'0')}`;
  
  let attempts = 0;
  while(existingCodes.has(generated) && attempts < 50) {
    num = Math.floor(Math.random() * 899 + 100);
    generated = `${prefix}${String(num).padStart(3,'0')}`;
    attempts++;
  }

  return generated.slice(0,6);
}

/* =========================================================================
   CAPA DE DATOS (Supabase)
   ========================================================================= */
const DB = {
  _products: [],
  _transactions: [],
  _reports: [],
  _users: [],
  _config: {},
  _loaded: false,

  async loadAll(){
    try{
      const [pRes, tRes, rRes, uRes, cRes] = await Promise.all([
        sb.from('productos').select('*').eq('activo', true).order('nombre'),
        sb.from('transacciones').select('*').order('fecha', {ascending:false}),
        sb.from('reportes').select('*').order('fecha', {ascending:false}),
        sb.from('usuarios').select('*').eq('activo', true).order('nombre'),
        sb.from('configuracion').select('*'),
      ]);
      this._products     = pRes.data || [];
      this._transactions = tRes.data || [];
      this._reports      = rRes.data || [];
      this._users        = uRes.data || [];
      this._config       = {};
      (cRes.data || []).forEach(r => { this._config[r.clave] = r.valor; });
      this._loaded = true;
    } catch(e){
      console.error('Error cargando datos de Supabase', e);
      toast('Error de conexión con la base de datos.', 'error');
    }
  },

  /* PRODUCTOS */
  getProducts(){ return this._products; },
  async saveProduct(p){
    const isNew = !p.id;
    const payload = {
      codigo: (p.codigo||'').slice(0,6).toUpperCase(),
      nombre: p.nombre, descripcion: p.descripcion || '', categoria: p.categoria,
      precio: parseFloat(p.precio)||0, costo: parseFloat(p.costo)||0,
      stock: parseFloat(p.stock)||0, stock_min: parseFloat(p.stock_min)||0,
      ubicacion: p.ubicacion, activo: true, actualizado_en: new Date().toISOString()
    };
    if(isNew){
      const { data, error } = await sb.from('productos').insert(payload).select().single();
      if(error) throw error;
      this._products.push(data);
      return data;
    } else {
      const { data, error } = await sb.from('productos').update(payload).eq('id', p.id).select().single();
      if(error) throw error;
      const i = this._products.findIndex(x=>x.id===p.id);
      if(i>=0) this._products[i] = data; else this._products.push(data);
      return data;
    }
  },
  async deleteProduct(id){
    const { error } = await sb.from('productos').update({activo:false}).eq('id', id);
    if(error) throw error;
    this._products = this._products.filter(p=>p.id!==id);
    return true;
  },
  async updateProductStock(id, delta){
    const prod = this._products.find(p=>p.id===id);
    if(!prod) return;
    const newStock = Math.max(0, parseFloat((parseFloat(prod.stock||0) + parseFloat(delta||0)).toFixed(2)));
    const { data, error } = await sb.from('productos').update({stock:newStock, actualizado_en:new Date().toISOString()}).eq('id',id).select().single();
    if(error) throw error;
    const i = this._products.findIndex(x=>x.id===id);
    if(i>=0) this._products[i] = data;
    return data;
  },

  /* TRANSACCIONES */
  getTransactions(){ return this._transactions; },
  async saveTransaction(tx){
    if(tx.items){
      for(const item of tx.items){
        const delta = tx.tipo === 'venta' ? -parseFloat(item.cantidad) : (tx.tipo === 'entrada_inventario' ? parseFloat(item.cantidad) : 0);
        if(delta !== 0) await this.updateProductStock(item.producto_id, delta);
      }
    }
    const { data, error } = await sb.from('transacciones').insert({
      tipo: tx.tipo, fecha: tx.fecha || new Date().toISOString(),
      descripcion: tx.descripcion || '', categoria: tx.categoria || '',
      total: tx.total, usuario_id: tx.usuario_id || null,
      usuario_nombre: tx.usuario_nombre || '', items: tx.items || null,
    }).select().single();
    if(error) throw error;
    this._transactions.unshift(data);
    return data;
  },
  async deleteTransaction(id){
    const tx = this._transactions.find(t=>t.id===id);
    if(!tx) return false;
    if(tx.items){
      for(const item of tx.items){
        const delta = tx.tipo === 'venta' ? parseFloat(item.cantidad) : (tx.tipo === 'entrada_inventario' ? -parseFloat(item.cantidad) : 0);
        if(delta !== 0) await this.updateProductStock(item.producto_id, delta);
      }
    }
    const { error } = await sb.from('transacciones').delete().eq('id', id);
    if(error) throw error;
    this._transactions = this._transactions.filter(t=>t.id!==id);
    return true;
  },

  /* REPORTES */
  getReports(){ return this._reports; },
  async saveReport(r){
    const payload = {
      id: r.id, fecha: r.fecha, total_ventas: r.total_ventas,
      total_costo_ventas: r.total_costo_ventas, total_gastos: r.total_gastos,
      utilidad_neta: r.utilidad_neta, num_ventas: r.num_ventas,
      top_productos: r.top_productos, resumen: r.resumen,
      fuente_resumen: r.fuente_resumen || 'local',
      generado_en: new Date().toISOString()
    };
    const { data, error } = await sb.from('reportes').upsert(payload).select().single();
    if(error) throw error;
    const i = this._reports.findIndex(x=>x.id===r.id);
    if(i>=0) this._reports[i] = data; else this._reports.unshift(data);
    return data;
  },

  /* USUARIOS */
  getUsers(){ return this._users; },
  getUserByCode(code){ return this._users.find(u=>u.codigo===code); },
  async saveUser(u){
    const isNew = !u.id;
    const payload = { codigo: u.codigo, nombre: u.nombre, rol: u.rol, activo: true };
    if(isNew){
      const { data, error } = await sb.from('usuarios').insert(payload).select().single();
      if(error) throw error;
      this._users.push(data);
      return data;
    } else {
      const { data, error } = await sb.from('usuarios').update(payload).eq('id', u.id).select().single();
      if(error) throw error;
      const i = this._users.findIndex(x=>x.id===u.id);
      if(i>=0) this._users[i] = data;
      return data;
    }
  },
  async deleteUser(id){
    const { error } = await sb.from('usuarios').update({activo:false}).eq('id', id);
    if(error) throw error;
    this._users = this._users.filter(u=>u.id!==id);
    return true;
  },

  /* CONFIGURACIÓN */
  getConfig(key, def){ return this._config[key] ?? def; },
  async setConfig(key, value){
    this._config[key] = String(value);
    const { error } = await sb.from('configuracion').upsert({clave:key, valor:String(value), actualizado_en:new Date().toISOString()});
    if(error) console.error('Error guardando config', error);
  },
};

/* =========================================================================
   SESIÓN Y TASA BCV
   ========================================================================= */
const Session = {
  get(){ try{ const r=localStorage.getItem(SESSION_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } },
  set(user){ localStorage.setItem(SESSION_KEY, JSON.stringify(user)); },
  clear(){ localStorage.removeItem(SESSION_KEY); },
};

const Rate = {
  state: { mode:'auto', bcvRate:null, bcvUpdatedAt:null, fetchedAt:null, manualRate:null, lastError:null },

  loadFromConfig(){
    this.state.mode       = DB.getConfig('modo_tasa', 'auto');
    this.state.manualRate = parseFloat(DB.getConfig('tasa_manual', '0')) || null;
  },
  markup(){ return parseFloat(DB.getConfig('margen_porcentaje', String(DEFAULT_MARKUP))) || DEFAULT_MARKUP; },
  sellRate(){
    if(this.state.mode==='manual'){
      return (this.state.manualRate && this.state.manualRate>0) ? this.state.manualRate : null;
    }
    if(this.state.bcvRate && this.state.bcvRate>0){
      return this.state.bcvRate * (1 + this.markup()/100);
    }
    return null;
  },
  toBs(usd){ const r=this.sellRate(); return r ? Number(usd||0)*r : null; },
  isStale(){ if(this.state.mode==='manual') return false; if(!this.state.fetchedAt) return true; return (Date.now()-new Date(this.state.fetchedAt).getTime())>(6*60*60*1000); },
  async fetchBcv(){
    try{
      const res = await fetch(BCV_ENDPOINT, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      const rate = Number(json.promedio ?? json.venta ?? json.compra);
      if(!rate || isNaN(rate) || rate<=0) throw new Error('Sin tasa válida');
      this.state.bcvRate = rate;
      this.state.bcvUpdatedAt = json.fechaActualizacion || null;
      this.state.fetchedAt = new Date().toISOString();
      this.state.lastError = null;
      return {ok:true, rate};
    }catch(err){
      this.state.lastError = (err&&err.message) ? err.message : 'Error de red';
      return {ok:false, error:this.state.lastError};
    }
  },
  async setManual(rate){
    this.state.manualRate = rate;
    this.state.mode = 'manual';
    await DB.setConfig('modo_tasa', 'manual');
    await DB.setConfig('tasa_manual', String(rate));
  },
  async setAuto(){
    this.state.mode = 'auto';
    await DB.setConfig('modo_tasa', 'auto');
  },
  async setMarkup(pct){
    await DB.setConfig('margen_porcentaje', String(pct));
  },
};

/* =========================================================================
   TOASTS & CONFIRMACIÓN
   ========================================================================= */
function toast(message, kind){
  kind = kind || 'info';
  const theme = {
    info:    {icon:'info',           cls:'border-sky-500/30 text-sky-100'},
    success: {icon:'check-circle-2', cls:'border-emerald-500/30 text-emerald-100'},
    error:   {icon:'alert-triangle', cls:'border-red-500/30 text-red-100'},
  }[kind] || {icon:'info', cls:'border-sky-500/30 text-sky-100'};
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = `toast-in glass-strong ${theme.cls} rounded-xl px-4 py-3 shadow-2xl flex items-start gap-2.5 text-sm w-full pointer-events-auto`;
  el.innerHTML = `<i data-lucide="${theme.icon}" class="w-4 h-4 mt-0.5 shrink-0"></i><span class="leading-snug">${esc(message)}</span>`;
  root.appendChild(el);
  if(window.lucide) lucide.createIcons({nodes:[el]});
  setTimeout(()=>{ el.style.transition='opacity .25s ease, transform .25s ease'; el.style.opacity='0'; el.style.transform='translateY(6px)'; setTimeout(()=>el.remove(), 260); }, 3400);
}

let _confirmResolver = null;
function askConfirm(title, message, confirmLabel, danger){
  return new Promise((resolve)=>{
    _confirmResolver = resolve;
    UI.confirmDialog = {title, message, confirmLabel:confirmLabel||'Confirmar', danger:!!danger};
    renderConfirmDialog();
  });
}
function resolveConfirm(value){ UI.confirmDialog=null; renderConfirmDialog(); if(_confirmResolver){ _confirmResolver(value); _confirmResolver=null; } }

function wireAutouppercase(){
  document.querySelectorAll('[data-uppercase="true"]').forEach(el=>{
    if(!el._ucWired){
      el._ucWired = true;
      el.addEventListener('input', ()=>{
        const start = el.selectionStart, end = el.selectionEnd;
        el.value = el.value.toUpperCase();
        try{ el.setSelectionRange(start, end); }catch(e){}
      });
      if(el.value) el.value = el.value.toUpperCase();
    }
  });
}

/* =========================================================================
   UTILIDADES DE NEGOCIO Y FECHAS
   ========================================================================= */
function txInRange(transactions, fromDate, toDate){
  return transactions.filter(t=>{
    const d = getLocalYYYYMMDD(t.fecha);
    return d >= fromDate && d <= toDate;
  });
}
function sumByType(list, type){ return list.filter(t=>t.tipo===type).reduce((s,t)=>s+Number(t.total||0),0); }
function getLowStock(products){ return products.filter(p=>parseFloat(p.stock)<=parseFloat(p.stock_min)).sort((a,b)=>a.stock-b.stock); }
function rangeForFilter(filter){
  const today = todayStr();
  if(filter==='hoy') return [today, today];
  if(filter==='semana'){
    const d = new Date(); d.setDate(d.getDate()-6);
    const from = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    return [from, today];
  }
  if(filter==='mes'){
    const d = new Date(); d.setDate(d.getDate()-29);
    const from = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    return [from, today];
  }
  return ['0000-00-00','9999-99-99'];
}

function composeLocalSummary(m){
  const {date,totalSales,totalCostOfSales,totalExpenses,netProfit,salesCount,topProducts,lowStockAlerts} = m;
  const grossMargin = totalSales>0 ? ((totalSales-totalCostOfSales)/totalSales*100) : 0;
  const p = [];
  if(salesCount===0){
    p.push(`El día ${fmtDateShort(date)} no registró ventas. Los gastos del día sumaron ${fmtUSD(totalExpenses)}.`);
  } else {
    p.push(`El día ${fmtDateShort(date)} se registraron ${salesCount} venta(s) por ${fmtUSD(totalSales)} (${fmtBs(Rate.toBs(totalSales))}), con costo de ${fmtUSD(totalCostOfSales)}. Margen bruto: ${grossMargin.toFixed(1)}%.`);
  }
  if(totalExpenses>0){
    p.push(`Los gastos operativos del día ascendieron a ${fmtUSD(totalExpenses)}. ${netProfit>=0?'La utilidad neta se mantuvo positiva en '+fmtUSD(netProfit)+'.':'La utilidad neta resultó negativa en -'+fmtUSD(Math.abs(netProfit))+'. Revisar si fue un gasto puntual.'}`);
  } else if(salesCount>0){
    p.push(`Sin gastos operativos registrados. Utilidad neta: ${fmtUSD(netProfit)} (${fmtBs(Rate.toBs(netProfit))}).`);
  }
  if(topProducts&&topProducts.length){
    const top = topProducts[0];
    p.push(`Producto de mayor movimiento: [${top.codigo||'SKU'}] "${top.nombre}" con ${fmtQty(top.cantidad)} unidades (${fmtUSD(top.ingresos)}).${topProducts.length>1?' Le siguieron '+topProducts.slice(1,3).map(t=>`[${t.codigo||'SKU'}] "${t.nombre}"`).join(' y ')+'.':''}`);
  }
  if(lowStockAlerts&&lowStockAlerts.length){
    p.push(`Atención: ${lowStockAlerts.length} producto(s) en o por debajo del stock mínimo. Planificar reabastecimiento.`);
  } else {
    p.push('El inventario se encuentra en niveles saludables.');
  }
  return p.join('\n\n');
}

async function generateReport(dateStr){
  const transactions = DB.getTransactions().filter(t => getLocalYYYYMMDD(t.fecha) === dateStr);
  let totalSales=0, totalCostOfSales=0, totalExpenses=0;
  const salesCount = transactions.filter(t=>t.tipo==='venta').length;
  const itemMap = {};
  transactions.forEach(t=>{
    if(t.tipo==='venta'){
      totalSales += Number(t.total||0);
      (t.items||[]).forEach(it=>{
        totalCostOfSales += Number(it.costo||0) * Number(it.cantidad||0);
        const k = it.nombre;
        if(!itemMap[k]) itemMap[k] = {nombre:it.nombre, codigo:it.codigo||'', qty:0, rev:0};
        itemMap[k].qty += Number(it.cantidad||0);
        itemMap[k].rev += Number(it.precio||0)*Number(it.cantidad||0);
      });
    } else if(t.tipo==='gasto'){ totalExpenses += Number(t.total||0); }
  });
  const netProfit = totalSales - totalCostOfSales - totalExpenses;
  const topProducts = Object.values(itemMap).map(d=>({nombre:d.nombre,codigo:d.codigo,cantidad:d.qty,ingresos:d.rev})).sort((a,b)=>b.cantidad-a.cantidad).slice(0,5);
  const lowStockAlerts = getLowStock(DB.getProducts()).map(p=>`[${p.codigo}] ${p.nombre} (stock:${fmtQty(p.stock)}/mín:${fmtQty(p.stock_min)})`);
  const metrics = {date:dateStr,totalSales,totalCostOfSales,totalExpenses,netProfit,salesCount,topProducts,lowStockAlerts};
  let summary = composeLocalSummary(metrics);
  let source = 'local';

  if(DB.getConfig('gemini_api_key','')){
    try{
      const ai = await withTimeout(callGeminiReportSummary(metrics), 9000);
      if(ai){ summary=ai; source='gemini'; }
    }catch(e){ console.warn('IA no disponible, usando resumen local.', e); }
  }

  return await DB.saveReport({
    id:dateStr, fecha:dateStr, total_ventas:totalSales, total_costo_ventas:totalCostOfSales,
    total_gastos:totalExpenses, utilidad_neta:netProfit, num_ventas:salesCount,
    top_productos:topProducts, resumen:summary, fuente_resumen:source
  });
}

function withTimeout(promise, ms){
  return Promise.race([promise, new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),ms))]);
}

function renderModal(){
  const m = UI.modal;
  if(!m) return '';
  if(m.type==='product') return renderProductModal(m.data);
  if(m.type==='transaction') return renderTransactionModal(m.txType, m.data);

  return '';
}
function closeModal(){ UI.modal=null; renderApp(); }

function triggerAutoCodeGen() {
  const catInput = document.getElementById('product-cat-input');
  const nameInput = document.getElementById('product-name-input');
  const codeInput = document.getElementById('product-code-input');
  if(!catInput || !nameInput || !codeInput) return;

  const cat = catInput.value.trim();
  const name = nameInput.value.trim();
  const generated = generateProductCode(cat, name);
  codeInput.value = generated;
  toast(`Código generado (máx 6): ${generated}`, 'info');
}

/* ---- Eventos de modal en vivo ---- */
function wireModalEvents(){
  const m = UI.modal;
  if(!m) return;

  if(m.type==='product'){
    const catInput = document.getElementById('product-cat-input');
    const nameInput = document.getElementById('product-name-input');
    const codeInput = document.getElementById('product-code-input');
    
    if(!m.data || !m.data.id){
      const autoUpdateCode = () => {
        if(!codeInput) return;
        const cat = catInput ? catInput.value.trim() : '';
        const name = nameInput ? nameInput.value.trim() : '';
        if(cat && name && (!codeInput.value || codeInput.dataset.autoGenerated === 'true')) {
          codeInput.value = generateProductCode(cat, name);
          codeInput.dataset.autoGenerated = 'true';
        }
      };
      if(catInput) catInput.addEventListener('change', autoUpdateCode);
      if(nameInput) nameInput.addEventListener('blur', autoUpdateCode);
      if(codeInput) codeInput.addEventListener('input', () => { codeInput.dataset.autoGenerated = 'false'; });
    }
  }

  if(m.type==='transaction' && m.txType==='venta'){
    const sel = document.getElementById('sale-product-select');
    const qty = document.getElementById('sale-qty');
    const preview = document.getElementById('sale-total-preview');
    const desc = document.querySelector('#tx-form [name="descripcion"]');
    const update = ()=>{
      const opt = sel.options[sel.selectedIndex];
      const price = opt ? Number(opt.dataset.price||0) : 0;
      const stock = opt ? parseFloat(opt.dataset.stock||0) : Infinity;
      const code = opt ? opt.dataset.code : '';
      const q = Math.max(0.01, parseFloat(qty.value||1));
      const total = price*q;
      if(preview) preview.textContent = sel.value ? `${fmtUSD(total)} · ${fmtBs(Rate.toBs(total))}` : '—';
      if(sel.value && desc && !desc.dataset.userEdited){ desc.value = `VENTA DE [${code}] ${opt.text.split(' — ')[0].replace(/^\[.*?\]\s*/,'')}`; }
      if(preview){ preview.classList.toggle('text-red-400', sel.value && q>stock); preview.classList.toggle('text-emerald-300', !sel.value || q<=stock); }
    };
    if(sel){ sel.addEventListener('change',update); qty.addEventListener('input',update); if(desc) desc.addEventListener('input',()=>desc.dataset.userEdited='1'); update(); }
  }

  if(m.type==='transaction' && m.txType==='entrada_inventario'){
    const sel = document.getElementById('entry-product-select');
    const qty = document.getElementById('entry-qty');
    const cost = document.getElementById('entry-cost');
    const preview = document.getElementById('entry-total-preview');
    const update = ()=>{
      const opt = sel.options[sel.selectedIndex];
      if(opt && opt.dataset.cost && !cost.dataset.userEdited) cost.value = opt.dataset.cost;
      const c = Number(cost.value||0), q = Math.max(0.01,parseFloat(qty.value||1));
      if(preview) preview.textContent = sel.value ? `Total: ${fmtUSD(c*q)}` : 'Total: —';
    };
    if(sel){ sel.addEventListener('change',update); qty.addEventListener('input',update); if(cost) cost.addEventListener('input',()=>{ cost.dataset.userEdited='1'; update(); }); update(); }
  }
}

const SPANISH_NUMBERS = {cero:0,un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiuno:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100};

function extractQuantity(norm){
  const decMatch = norm.match(/(\d+[\.,]\d+)/);
  if(decMatch) return parseFloat(decMatch[0].replace(',','.'));
  
  if(norm.includes('medio') || norm.includes('un medio')) return 0.5;
  if(norm.includes('uno y medio') || norm.includes('1 y medio')) return 1.5;
  if(norm.includes('dos y medio') || norm.includes('2 y medio')) return 2.5;

  const m = norm.match(/\d+/);
  if(m) return parseFloat(m[0]);
  const words = norm.split(' ');
  for(const w of words){ if(SPANISH_NUMBERS[w]!==undefined) return SPANISH_NUMBERS[w]; }
  return null;
}

function matchProducts(norm){
  const products = DB.getProducts();
  const scored = [];
  for(const p of products){
    let score = 0;
    const nCode = normalize(p.codigo);
    const nName = normalize(p.nombre);
    const nCat = normalize(p.categoria);
    if(norm.includes(nCode)) score = 100;
    else if(norm.includes(nName)) score = 80;
    else {
      const words = nName.split(' ').filter(w=>w.length>=3);
      const catWords = nCat.split(' ').filter(w=>w.length>=3);
      const hitName = words.filter(w=>norm.includes(w)).length;
      const hitCat = catWords.filter(w=>norm.includes(w)).length;
      if(hitName>0) score = 40+(hitName/Math.max(1,words.length))*30;
      else if(hitCat>0) score = 20+(hitCat/Math.max(1,catWords.length))*15;
    }
    if(score>0) scored.push({product:p, score});
  }
  return scored.sort((a,b)=>b.score-a.score).slice(0,5);
}

const SALE_WORDS = ['vender','vendi','vendimos','venda','vendo','despachar','despacho','sali','salio','salida de','cobrar','facturar'];
const ENTRY_WORDS = ['entrar','entrada','entro','recibir','recibi','cargar','cargue','reabastecer','reponer','comprar','compre','ingresar','ingreso','sumar stock','agregar stock'];
const ACCOUNTING_WORDS = ['cuanto vendimos','ventas del dia','venta del dia','ganancia','ganancias','utilidad','cuanto hemos vendido','resumen del dia','como va la caja','cuanto llevamos','estado de cuentas','finanzas','balance'];
const STOCK_QUERY = ['tenemos','hay','tienes','disponible','existencia','cuanto queda','cuantos quedan','donde esta','donde se','ubicacion','precio de','cuanto cuesta','cuesta','stock de','codigo de'];

function detectIntent(norm){
  if(ACCOUNTING_WORDS.some(w=>norm.includes(w))) return 'accounting_status';
  if(SALE_WORDS.some(w=>norm.includes(w))) return 'sale_action';
  if(ENTRY_WORDS.some(w=>norm.includes(w))) return 'entry_action';
  if(STOCK_QUERY.some(w=>norm.includes(w))) return 'stock_query';
  return null;
}

function processVoiceQuery(rawQuery){
  if(!rawQuery||!rawQuery.trim()) return null;
  const norm = normalize(rawQuery);
  const intent = detectIntent(norm);
  const qty = extractQuantity(norm) || 1;
  const matches = matchProducts(norm);
  const today = todayStr();

  if(intent==='accounting_status'){
    const todayTx = txInRange(DB.getTransactions(), today, today);
    const sales = sumByType(todayTx,'venta'), expenses = sumByType(todayTx,'gasto'), net = sales-expenses;
    return {
      kind:'accounting_status',
      answer:`Resumen de hoy: ventas por **${fmtUSD(sales)}** (${fmtBs(Rate.toBs(sales))}), gastos por **${fmtUSD(expenses)}** (${fmtBs(Rate.toBs(expenses))}). Utilidad: **${fmtUSD(net)}** (${fmtBs(Rate.toBs(net))}).`,
      spokenAnswer:`Hoy llevamos ventas por ${sales.toFixed(0)} dólares y gastos por ${expenses.toFixed(0)} dólares. La utilidad del día es de ${net.toFixed(0)} dólares.`,
      matches:[], pending:null,
    };
  }

  if(intent==='sale_action'){
    const best = matches[0];
    if(!best) return {kind:'unknown', answer:'Entendí que quieres registrar una venta, pero no identifiqué el producto. Intenta mencionar su nombre o código SKU, ej: **"vender 1,5 metros de arena"**.', spokenAnswer:'No identifiqué el producto. Intenta de nuevo mencionando su nombre o código.', matches:[], pending:null};
    const p = best.product;
    if(parseFloat(p.stock) < qty) return {kind:'search_product', answer:`No puedo registrar la venta de **${fmtQty(qty)}** unidades de **[${p.codigo}] ${p.nombre}** porque solo quedan **${fmtQty(p.stock)}**.`, spokenAnswer:`No hay suficiente existencia. Solo quedan ${fmtQty(p.stock)} unidades de ${p.nombre}.`, matches:[{product:p}], pending:null};
    const total = p.precio*qty;
    return {kind:'confirm_sale', answer:`¿Confirmas la venta de **${fmtQty(qty)} unidad(es)** de **[${p.codigo}] ${p.nombre}** por **${fmtUSD(total)}** (${fmtBs(Rate.toBs(total))})?`, spokenAnswer:`¿Confirmas la venta de ${fmtQty(qty)} unidades de ${p.nombre} por ${total.toFixed(2)} dólares?`, matches:[{product:p}], pending:{type:'venta',productId:p.id,productName:p.nombre,productCode:p.codigo,quantity:qty,total}};
  }

  if(intent==='entry_action'){
    const best = matches[0];
    if(best){
      const p = best.product;
      const totalCost = p.costo*qty;
      return {kind:'confirm_entry', answer:`¿Confirmas agregar **${fmtQty(qty)} unidad(es)** de **[${p.codigo}] ${p.nombre}** al inventario (costo est. ${fmtUSD(totalCost)})?`, spokenAnswer:`¿Confirmas agregar ${fmtQty(qty)} unidades de ${p.nombre} al inventario?`, matches:[{product:p}], pending:{type:'entrada_inventario',productId:p.id,productName:p.nombre,productCode:p.codigo,quantity:qty,totalCost}};
    }
    return {kind:'unknown', answer:'Entendí que quieres registrar una entrada de inventario, pero no identifiqué el producto. Abre el formulario desde **Cuentas → Entrada Stock**.', spokenAnswer:'No identifiqué el producto para la entrada. Usa el formulario manual.', matches:[], pending:null};
  }

  if(intent==='stock_query' || matches.length){
    if(matches.length){
      const p = matches[0].product;
      const priceBs = Rate.toBs(p.precio);
      return {kind:'search_product', answer:`Sí, tenemos **[${p.codigo}] ${p.nombre}**. Quedan **${fmtQty(p.stock)} unidades** en **${p.ubicacion}**, a **${fmtUSD(p.precio)}** (${fmtBs(priceBs)}) c/u.`, spokenAnswer:`Del producto ${p.nombre} quedan ${fmtQty(p.stock)} unidades en ${p.ubicacion}. El precio es de ${p.precio.toFixed(2)} dólares.`, matches, pending:null};
    }
    return {kind:'unknown', answer:`No encontré productos que coincidan con "${esc(rawQuery)}". Prueba con el código SKU o nombre exacto.`, spokenAnswer:'No encontré ese producto. Intenta con otro nombre o código.', matches:[], pending:null};
  }

  return {kind:'unknown', answer:`No entendí la consulta: **"${esc(rawQuery)}"**. Prueba: "vender 1.5 metros de arena", "¿tenemos cal?" o "¿cuánto vendimos hoy?".`, spokenAnswer:'No logré entender la consulta. Intenta con otra frase.', matches:[], pending:null};
}

async function commitPendingVoiceAction(pending){
  const user = Session.get();
  try{
    if(pending.type==='venta'){
      const p = DB.getProducts().find(x=>x.id===pending.productId);
      if(!p || parseFloat(p.stock)<pending.quantity){ toast('El stock cambió, no es posible completar esta venta.','error'); return false; }
      await DB.saveTransaction({
        tipo:'venta', fecha:new Date().toISOString(),
        descripcion:`VENTA POR VOZ DE [${p.codigo}] ${p.nombre}`, categoria:'VENTAS', total:p.precio*pending.quantity,
        items:[{producto_id:p.id, codigo:p.codigo, nombre:p.nombre, cantidad:pending.quantity, precio:p.precio, costo:p.costo}],
        usuario_id:user.id||null, usuario_nombre:user.nombre+' (VOZ)',
      });
      toast(`Venta registrada: ${fmtQty(pending.quantity)}× [${p.codigo}] ${p.nombre}`,'success');
      return true;
    }
    if(pending.type==='entrada_inventario'){
      const p = DB.getProducts().find(x=>x.id===pending.productId);
      if(!p) return false;
      await DB.saveTransaction({
        tipo:'entrada_inventario', fecha:new Date().toISOString(),
        descripcion:`ENTRADA POR VOZ DE [${p.codigo}] ${p.nombre}`, categoria:'COMPRAS DE INVENTARIO', total:p.costo*pending.quantity,
        items:[{producto_id:p.id, codigo:p.codigo, nombre:p.nombre, cantidad:pending.quantity, precio:p.precio, costo:p.costo}],
        usuario_id:user.id||null, usuario_nombre:user.nombre+' (VOZ)',
      });
      toast(`Inventario actualizado: +${fmtQty(pending.quantity)} [${p.codigo}] ${p.nombre}`,'success');
      return true;
    }
  }catch(e){ toast('Error al procesar la acción: '+e.message,'error'); }
  return false;
}

function formatVoiceAnswer(a){ return esc(a||'').replace(/\*\*(.+?)\*\*/g,'<b class="text-white">$1</b>'); }

let recognition = null;
function setupSpeechRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ UI.voice.supported=false; return; }
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'es-VE';
  recognition.onstart = ()=>{ UI.voice.listening=true; UI.voice.transcript=''; UI.voice.interim=''; UI.voice.error=null; UI.voice.lastResult=null; if(window.speechSynthesis) speechSynthesis.cancel(); refreshVoicePanel(); };
  recognition.onresult = (e)=>{ let interim='',final=''; for(let i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal) final+=e.results[i][0].transcript; else interim+=e.results[i][0].transcript; } if(final) UI.voice.transcript=final; UI.voice.interim=interim; refreshVoicePanel(); };
  recognition.onerror = (e)=>{ UI.voice.listening=false; UI.voice.error=e.error==='not-allowed'?'Permiso de micrófono denegado. Habilítalo en la configuración de tu navegador.':'Error de reconocimiento: '+e.error; refreshVoicePanel(); };
  recognition.onend = ()=>{ UI.voice.listening=false; refreshVoicePanel(); if(UI.voice.transcript) handleVoiceQuery(UI.voice.transcript); };
}

function toggleListen(){
  if(!UI.voice.supported){ UI.voice.error='Tu navegador no soporta control por voz. Usa Google Chrome.'; refreshVoicePanel(); return; }
  if(!recognition) setupSpeechRecognition();
  if(!recognition) return;
  if(UI.voice.listening){ try{ recognition.stop(); }catch(e){} }
  else { try{ recognition.start(); }catch(e){ console.error(e); UI.voice.error='No se pudo iniciar el micrófono: '+e.message; refreshVoicePanel(); } }
}

async function handleVoiceQuery(text){
  if(!text||!text.trim()) return;
  UI.voice.loading=true; UI.voice.error=null; refreshVoicePanel();
  let result = processVoiceQuery(text);

  if(result && DB.getConfig('gemini_api_key','')){
    try{
      const enhanced = await withTimeout(callGeminiVoiceAnswer(text, result), 7000);
      if(enhanced && enhanced.answer && enhanced.spokenAnswer) result = Object.assign({},result,{answer:enhanced.answer,spokenAnswer:enhanced.spokenAnswer});
    }catch(e){ console.warn('IA no disponible, usando motor local.'); }
  }

  UI.voice.loading=false; UI.voice.lastResult=result; refreshVoicePanel();
  if(DB.getConfig('tts_enabled','true')==='true' && result) speak(result.spokenAnswer||result.answer);
}

function speak(text){
  if(!text||!window.speechSynthesis) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text.replace(/\*\*/g,'')); u.lang='es-ES'; speechSynthesis.speak(u); }catch(e){}
}

function refreshVoicePanel(){
  const existing = document.querySelector('[data-voice-root]');
  if(!UI.voice.open){ if(existing) existing.remove(); return; }
  const html = renderVoicePanel();
  if(existing){ existing.outerHTML=html; } else { document.body.insertAdjacentHTML('beforeend',html); }
  if(window.lucide) lucide.createIcons();
  wireAutouppercase();
}

function openVoice(){ UI.voice.open=true; UI.voice.transcript=''; UI.voice.interim=''; UI.voice.lastResult=null; UI.voice.error=null; if(!recognition) setupSpeechRecognition(); renderApp(); }
function closeVoice(){ if(recognition&&UI.voice.listening){ try{ recognition.stop(); }catch(e){} } if(window.speechSynthesis) speechSynthesis.cancel(); UI.voice.open=false; renderApp(); }
function submitVoiceText(query){ UI.voice.transcript=query; handleVoiceQuery(query); }
async function confirmVoiceAction(){ const r=UI.voice.lastResult; if(!r||!r.pending) return; const ok=await commitPendingVoiceAction(r.pending); if(ok) closeVoice(); }
function cancelVoiceAction(){ UI.voice.lastResult=null; refreshVoicePanel(); }
function voiceGoToProduct(id){ const p=DB.getProducts().find(x=>x.id===id); closeVoice(); UI.activeTab='inventario'; UI.invSearch=p?p.codigo||p.nombre:''; renderApp(); }

async function geminiCall(prompt){
  const key = DB.getConfig('gemini_api_key','');
  const model = DB.getConfig('gemini_model','gemini-2.5-flash');
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
  if(!res.ok) throw new Error('Gemini HTTP '+res.status);
  const json = await res.json();
  const parts = json?.candidates?.[0]?.content?.parts;
  const text = parts ? parts.map(p=>p.text||'').join('') : '';
  if(!text.trim()) throw new Error('Respuesta vacía');
  return text.trim();
}
async function callGeminiVoiceAnswer(query, result){
  const prompt = `Eres el asistente de voz de una tienda de pinturas y materiales venezolana llamada "Pinturas Valle Fresco 230". Reformula la respuesta YA CALCULADA de forma natural y amable en español, sin inventar ni alterar datos numéricos.\nConsulta: "${query}"\nDatos (no cambiar): ${JSON.stringify({answer:result.answer,spokenAnswer:result.spokenAnswer})}\nDevuelve SOLO JSON válido, sin markdown:\n{"answer":"...","spokenAnswer":"..."}`;
  const text = await geminiCall(prompt);
  const parsed = JSON.parse(text.replace(/```json|```/g,'').trim());
  if(!parsed.answer||!parsed.spokenAnswer) throw new Error('Formato inesperado');
  return parsed;
}
async function callGeminiReportSummary(m){
  const prompt = `Genera un resumen ejecutivo profesional en español (3-4 párrafos, texto fluido, sin markdown ni títulos) para el cierre diario de una tienda de pinturas y materiales venezolana llamada "Pinturas Valle Fresco 230".\nDatos del día ${m.date}: ventas $${m.totalSales.toFixed(2)}, costo de ventas $${m.totalCostOfSales.toFixed(2)}, gastos $${m.totalExpenses.toFixed(2)}, utilidad $${m.netProfit.toFixed(2)}, ventas registradas: ${m.salesCount}.\nTop productos con sus SKU: ${JSON.stringify(m.topProducts)}.\nStock bajo: ${m.lowStockAlerts.length?m.lowStockAlerts.join('; '):'ninguno'}.\nTono directo, profesional. No inventes cifras.`;
  return await geminiCall(prompt);
}

async function quickStock(id, delta){
  if(!isAdmin(Session.get())) return;
  const p = DB.getProducts().find(x=>x.id===id);
  if(!p) return;
  const user = Session.get();
  const d = parseFloat(delta);
  try{
    if(d > 0){
      await DB.saveTransaction({
        tipo:'entrada_inventario', fecha:new Date().toISOString(),
        descripcion:`ENTRADA RÁPIDA: [${p.codigo}] ${p.nombre}`, categoria:'COMPRAS DE INVENTARIO', total:p.costo*d,
        items:[{producto_id:p.id, codigo:p.codigo, nombre:p.nombre, cantidad:d, precio:p.precio, costo:p.costo}],
        usuario_id:user.id||null, usuario_nombre:user.nombre,
      });
      toast(`+${fmtQty(d)} u. a [${p.codigo}] ${p.nombre}`,'success');
    } else {
      if(parseFloat(p.stock)<=0){ toast('El stock ya está en cero.','error'); return; }
      await DB.updateProductStock(id, d);
      toast(`Corrección stock: [${p.codigo}] ${p.nombre} → ${fmtQty(Math.max(0,parseFloat(p.stock)+d))} u.`,'info');
    }
    refreshProductList();
  }catch(e){ toast('Error actualizando stock: '+e.message,'error'); }
}

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  if(el.hasAttribute('data-backdrop') && e.target!==el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  switch(action){
    case 'setTab': setTab(el.dataset.tab); break;
    case 'openVoice': openVoice(); break;
    case 'closeVoice': closeVoice(); break;
    case 'toggleListen': toggleListen(); break;
    case 'confirmVoiceAction': confirmVoiceAction(); break;
    case 'cancelVoiceAction': cancelVoiceAction(); break;
    case 'voiceGoToProduct': voiceGoToProduct(id); break;
    case 'refreshRate': refreshRateAction(); break;
    case 'openTransactionModal': openTransactionModal(el.dataset.txtype); break;
    case 'shareTx': shareTx(id); break;
    case 'deleteTx': deleteTx(id); break;
    case 'quickStock': quickStock(id, parseFloat(el.dataset.delta||0)); break;
    case 'shareProduct': shareProduct(id); break;
    case 'editProduct': editProduct(id); break;
    case 'deleteProduct': deleteProductAction(id); break;
    case 'openProductModal': openProductModal(null); break;
    case 'closeModal': closeModal(); break;
    case 'setTxFilter': UI.txFilter=el.dataset.filter; renderApp(); break;
    case 'setRateMode': setRateMode(el.dataset.mode); break;
    case 'saveMarkup': saveMarkup(); break;
    case 'saveManualRate': saveManualRate(); break;
    case 'openUserModal': openUserModal(); break;
    case 'editUser': editUser(el.dataset.uid); break;
    case 'deleteUser': deleteUserAction(el.dataset.uid); break;
    case 'toggleAiPanel': toggleAiPanel(); break;
    case 'saveGeminiSettings': saveGeminiSettings(); break;
    case 'shareApp': shareApp(); break;
    case 'shareReport': shareReport(id); break;
    case 'generateReport': generateReportAction(); break;
    case 'logout': logout(); break;
    case 'confirmYes': resolveConfirm(true); break;
    case 'confirmNo': resolveConfirm(false); break;
  }
});

document.addEventListener('submit', async function(e){
  const form = e.target;
  if(!form.dataset||!form.dataset.form) return;
  e.preventDefault();
  const type = form.dataset.form;
  const user = Session.get();

  /* LOGIN */
  if(type==='login'){
    const pin = form.querySelector('[name="pin"]').value.trim();
    UI.loginLoading=true; UI.loginError=null; renderApp();
    try{
      const {data, error} = await sb.from('usuarios').select('*').eq('codigo',pin).eq('activo',true).single();
      if(error||!data){ UI.loginError='Código incorrecto. Contacta al administrador.'; UI.loginLoading=false; renderApp(); return; }
      Session.set(data);
      UI.loginLoading=false; UI.loginError=null;
      renderApp();
    }catch(e){ UI.loginError='Error de conexión con la base de datos.'; UI.loginLoading=false; renderApp(); }
    return;
  }

  /* PRODUCTO (solo admin) */
  if(type==='product'){
    if(!isAdmin(user)){ toast('Sin permisos.','error'); return; }
    const f = (name) => form.querySelector(`[name="${name}"]`).value;
    const id = form.dataset.id || null;
    let codigo = toUpper(f('codigo').trim()).slice(0,6);
    const nombre = toUpper(f('nombre').trim());
    const categoria = toUpper(f('categoria').trim());

    if(!codigo) {
      codigo = generateProductCode(categoria, nombre);
    }

    const product = {
      id, codigo, nombre, descripcion:toUpper(f('descripcion').trim()),
      categoria, precio:parseFloat(f('precio'))||0,
      costo:parseFloat(f('costo'))||0, stock:parseFloat(f('stock'))||0,
      stock_min:parseFloat(f('stock_min'))||0, ubicacion:toUpper(f('ubicacion').trim()),
    };
    if(!product.codigo||!product.nombre||!product.categoria){ toast('Completa código SKU, nombre y categoría del producto.','error'); return; }
    try{ await DB.saveProduct(product); toast(id?'Producto actualizado.':`Producto [${product.codigo}] registrado.`,'success'); closeModal(); }
    catch(e){ toast('Error al guardar: '+e.message,'error'); }
    return;
  }

  /* VENTA */
  if(type==='sale-tx'){
    const productId = form.querySelector('[name="productId"]').value;
    const cantidad = parseFloat(form.querySelector('[name="cantidad"]').value)||1;
    const noteEl = form.querySelector('[name="descripcion"]');
    if(!productId){ toast('Selecciona un producto.','error'); return; }
    const p = DB.getProducts().find(x=>x.id===productId);
    if(!p){ toast('Producto no encontrado.','error'); return; }
    if(parseFloat(p.stock)<cantidad){ toast(`Stock insuficiente. Quedan ${fmtQty(p.stock)} unidades.`,'error'); return; }
    try{
      await DB.saveTransaction({
        tipo:'venta', fecha:new Date().toISOString(),
        descripcion:toUpper((noteEl&&noteEl.value.trim())||`VENTA DE [${p.codigo}] ${p.nombre}`),
        categoria:'VENTAS', total:p.precio*cantidad,
        items:[{producto_id:p.id, codigo:p.codigo, nombre:p.nombre, cantidad, precio:p.precio, costo:p.costo}],
        usuario_id:user.id||null, usuario_nombre:user.nombre,
      });
      toast('Venta y facturación registrada.','success'); closeModal();
    }catch(e){ toast('Error al registrar: '+e.message,'error'); }
    return;
  }

  /* GASTO (solo admin) */
  if(type==='expense-tx'){
    if(!isAdmin(user)){ toast('Sin permisos.','error'); return; }
    const descripcion = toUpper(form.querySelector('[name="descripcion"]').value.trim());
    const categoria = toUpper(form.querySelector('[name="categoria"]').value.trim()||'GASTOS OPERATIVOS');
    const total = parseFloat(form.querySelector('[name="total"]').value);
    if(!descripcion||!total||total<=0){ toast('Completa la descripción y un monto válido.','error'); return; }
    try{
      await DB.saveTransaction({tipo:'gasto',fecha:new Date().toISOString(),descripcion,categoria,total,usuario_id:user.id||null,usuario_nombre:user.nombre});
      toast('Gasto registrado.','success'); closeModal();
    }catch(e){ toast('Error al registrar: '+e.message,'error'); }
    return;
  }

  /* ENTRADA DE INVENTARIO (solo admin) */
  if(type==='entry-tx'){
    if(!isAdmin(user)){ toast('Sin permisos.','error'); return; }
    const productId = form.querySelector('[name="productId"]').value;
    const cantidad = parseFloat(form.querySelector('[name="cantidad"]').value)||1;
    const p = DB.getProducts().find(x=>x.id===productId);
    if(!p){ toast('Selecciona un producto.','error'); return; }
    const unitCostRaw = form.querySelector('[name="unitCost"]').value;
    const unitCost = unitCostRaw!=='' ? parseFloat(unitCostRaw) : p.costo;
    try{
      await DB.saveTransaction({
        tipo:'entrada_inventario', fecha:new Date().toISOString(),
        descripcion:`ENTRADA DE INVENTARIO: [${p.codigo}] ${p.nombre}`, categoria:'COMPRAS DE INVENTARIO', total:unitCost*cantidad,
        items:[{producto_id:p.id, codigo:p.codigo, nombre:p.nombre, cantidad, precio:p.precio, costo:unitCost}],
        usuario_id:user.id||null, usuario_nombre:user.nombre,
      });
      toast('Entrada de inventario registrada.','success'); closeModal();
    }catch(e){ toast('Error al registrar: '+e.message,'error'); }
    return;
  }

  /* USUARIO (solo admin) */
  if(type==='user'){
    if(!isAdmin(user)){ toast('Sin permisos.','error'); return; }
    const nombre = toUpper(form.querySelector('[name="nombre"]').value.trim());
    const codigo = form.querySelector('[name="codigo"]').value.trim();
    const rol = form.querySelector('[name="rol"]').value;
    const uid_edit = form.dataset.uid;
    if(!nombre||!/^\d{4,6}$/.test(codigo)){ toast('El PIN debe tener entre 4 y 6 dígitos.','error'); return; }
    const existing = DB.getUsers().find(u=>u.codigo===codigo && u.id!==uid_edit);
    if(existing){ toast('Ese código PIN ya está en uso por otro usuario.','error'); return; }
    try{
      const saved = await DB.saveUser({id:uid_edit||null,codigo,nombre,rol});
      if(user.id===uid_edit) Session.set(saved);
      toast('Acceso guardado.','success'); closeModal();
    }catch(e){ toast('Error al guardar: '+e.message,'error'); }
    return;
  }

  /* CONSULTA DE VOZ POR TEXTO */
  if(type==='voice-text'){
    const query = form.querySelector('[name="query"]').value.trim();
    if(!query) return;
    form.reset();
    submitVoiceText(query);
    return;
  }
});
