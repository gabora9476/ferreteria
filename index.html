/* ------------------------------ Utilidades -------------------------------*/
function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalize(s){
  return String(s ?? '')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s.]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function fmtUSD(n){ return '$' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtBs(n){
  if(n === null || n === undefined || isNaN(n)) return '—';
  return 'Bs. ' + Number(n).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function dayOffsetISO(offsetDays, hh, mm){
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  d.setHours(hh ?? 12, mm ?? 0, 0, 0);
  return d.toISOString();
}
function dayOffsetStr(offsetDays){
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtDateShort(iso){
  try{
    return new Date(iso).toLocaleDateString('es-VE',{ day:'2-digit', month:'short', year:'numeric' });
  }catch(e){ return iso; }
}
function fmtDateTime(iso){
  try{
    return new Date(iso).toLocaleString('es-VE',{ day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }catch(e){ return iso; }
}
function fmtTime(iso){
  try{ return new Date(iso).toLocaleTimeString('es-VE',{ hour:'2-digit', minute:'2-digit' }); }catch(e){ return ''; }
}
function clamp(n,min,max){ return Math.min(max, Math.max(min, n)); }
function debounce(fn, ms){
  let t = null;
  return function(...args){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,args), ms); };
}

  { bg:'bg-teal-500/15',   text:'text-teal-300',   ring:'ring-teal-500/30' },
  { bg:'bg-indigo-500/15', text:'text-indigo-300', ring:'ring-indigo-500/30' },
  { bg:'bg-orange-500/15', text:'text-orange-300', ring:'ring-orange-500/30' },
];
function categoryTheme(cat){
  let h = 0;
  const s = String(cat||'');
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return CATEGORY_THEMES[h % CATEGORY_THEMES.length];
}
function categoryBadge(cat){
  const t = categoryTheme(cat);
  return `<span class="badge ${t.bg} ${t.text} ring-1 ${t.ring}">${esc(cat)}</span>`;
}

/* ------------------------------ Capa de datos (localStorage) -------------*/
const DB = {
  data: null,
  load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        this.data = JSON.parse(raw);
        this.data.products = this.data.products || defaultProducts();
        this.data.transactions = this.data.transactions || [];
        this.data.reports = this.data.reports || [];
        this.data.users = (this.data.users && this.data.users.length) ? this.data.users : defaultUsers();
      } else {
        this.data = {
          products: defaultProducts(),
          transactions: defaultTransactions(),
          reports: defaultReports(),
          users: defaultUsers(),
        };
        this.save();
      }
    }catch(e){
      console.error('Error cargando base de datos local, se reinicia con valores de fábrica.', e);
      this.data = { products: defaultProducts(), transactions: defaultTransactions(), reports: defaultReports(), users: defaultUsers() };
      this.save();
    }
    return this.data;
  },
  save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data)); }
    catch(e){ console.error('No se pudo guardar la base de datos local', e); toast('No se pudo guardar: almacenamiento lleno o bloqueado.', 'error'); }
  },
  // Productos
  getProducts(){ return this.data.products; },
  saveProduct(p){
    const i = this.data.products.findIndex(x=>x.id===p.id);
    if(i>=0) this.data.products[i] = p; else this.data.products.push(p);
    this.save(); return p;
  },
  deleteProduct(id){
    const before = this.data.products.length;
    this.data.products = this.data.products.filter(p=>p.id!==id);
    this.save(); return this.data.products.length !== before;
  },
  // Transacciones
  getTransactions(){ return this.data.transactions; },
  saveTransaction(tx){
    if(tx.items){
      for(const item of tx.items){
        const prod = this.data.products.find(p=>p.id===item.productId);
        if(prod){
          if(tx.type === 'sale') prod.stock = Math.max(0, prod.stock - item.quantity);
          else if(tx.type === 'inventory_entry') prod.stock += item.quantity;
        }
      }
    }
    this.data.transactions.push(tx);
    this.save(); return tx;
  },
  deleteTransaction(id){
    const idx = this.data.transactions.findIndex(t=>t.id===id);
    if(idx === -1) return false;
    const tx = this.data.transactions[idx];
    if(tx.items){
      for(const item of tx.items){
        const prod = this.data.products.find(p=>p.id===item.productId);
        if(prod){
          if(tx.type === 'sale') prod.stock += item.quantity;
          else if(tx.type === 'inventory_entry') prod.stock = Math.max(0, prod.stock - item.quantity);
        }
      }
    }
    this.data.transactions.splice(idx,1);
    this.save(); return true;
  },
  // Reportes
  getReports(){ return this.data.reports; },
  saveReport(r){
    const i = this.data.reports.findIndex(x=>x.id===r.id);
    if(i>=0) this.data.reports[i] = r; else this.data.reports.push(r);
    this.save(); return r;
  },
  // Usuarios
  getUsers(){ return this.data.users; },
  getUserByCode(code){ return this.data.users.find(u=>u.code===code); },
  saveUser(u){
    const i = this.data.users.findIndex(x=>x.code===u.code);
    if(i>=0) this.data.users[i] = u; else this.data.users.push(u);
    this.save(); return u;
  },
  deleteUser(code){
    const before = this.data.users.length;
    this.data.users = this.data.users.filter(u=>u.code!==code);
    this.save(); return this.data.users.length !== before;
  },
};

/* ------------------------------ Configuración y sesión -------------------*/
const Settings = {
  data: null,
  load(){
    try{
      const raw = localStorage.getItem(SETTINGS_KEY);
      this.data = raw ? JSON.parse(raw) : {};
    }catch(e){ this.data = {}; }
    this.data.markupPercent = (this.data.markupPercent === undefined || this.data.markupPercent === null) ? DEFAULT_MARKUP : this.data.markupPercent;
    this.data.geminiApiKey = this.data.geminiApiKey || '';
    this.data.geminiModel = this.data.geminiModel || 'gemini-2.5-flash';
    this.data.ttsEnabled = this.data.ttsEnabled !== false;
    return this.data;
  },
  save(){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(this.data)); },
  set(patch){ Object.assign(this.data, patch); this.save(); },
};

const Session = {
  get(){
    try{ const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }
    catch(e){ return null; }
  },
  set(user){ localStorage.setItem(SESSION_KEY, JSON.stringify(user)); },
  clear(){ localStorage.removeItem(SESSION_KEY); },
};

/* ------------------------------ Tasa BCV (automática + margen) -----------
   Fuente: dolarapi.com — proyecto abierto que replica la tasa oficial
   publicada por el Banco Central de Venezuela. Sin necesidad de API key.
   sellRate = tasaBCV * (1 + markupPercent/100)  → por defecto markup = 5%
   --------------------------------------------------------------------- */
const Rate = {
  state: null,
  load(){
    try{
      const raw = localStorage.getItem(RATE_KEY);
      this.state = raw ? JSON.parse(raw) : {};
    }catch(e){ this.state = {}; }
    this.state.mode = this.state.mode || 'auto';       // 'auto' | 'manual'
    this.state.bcvRate = this.state.bcvRate ?? null;     // último valor oficial conocido
    this.state.bcvUpdatedAt = this.state.bcvUpdatedAt || null; // fecha que publica la fuente
    this.state.fetchedAt = this.state.fetchedAt || null;       // cuándo lo obtuvimos nosotros
    this.state.manualRate = this.state.manualRate ?? null;
    this.state.lastError = null;
    return this.state;
  },
  persist(){ localStorage.setItem(RATE_KEY, JSON.stringify(this.state)); },
  markup(){ return Settings.data.markupPercent ?? DEFAULT_MARKUP; },
  /** Tasa de venta vigente en Bs./USD ya con el margen aplicado (o la manual). */
  sellRate(){
    if(this.state.mode === 'manual'){
      return (this.state.manualRate && this.state.manualRate > 0) ? this.state.manualRate : null;
    }
    if(this.state.bcvRate && this.state.bcvRate > 0){
      return this.state.bcvRate * (1 + this.markup()/100);
    }
    return null;
  },
  toBs(usd){
    const r = this.sellRate();
    return r ? Number(usd || 0) * r : null;
  },
  isStale(){
    if(this.state.mode === 'manual') return false;
    if(!this.state.fetchedAt) return true;
    return (Date.now() - new Date(this.state.fetchedAt).getTime()) > (6 * 60 * 60 * 1000); // 6h
  },
  async fetchBcv(){
    try{
      const res = await fetch(BCV_ENDPOINT, { cache:'no-store' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      const rate = Number(json.promedio ?? json.venta ?? json.compra);
      if(!rate || isNaN(rate) || rate <= 0) throw new Error('Respuesta sin tasa válida');
      this.state.bcvRate = rate;
      this.state.bcvUpdatedAt = json.fechaActualizacion || null;
      this.state.fetchedAt = new Date().toISOString();
      this.state.lastError = null;
      this.persist();
      return { ok:true, rate };
    }catch(err){
      console.warn('No se pudo obtener la tasa BCV automática:', err);
      this.state.lastError = (err && err.message) ? err.message : 'Error de red';
      this.persist();
      return { ok:false, error: this.state.lastError };
    }
  },
  setManual(rate){
    this.state.manualRate = rate;
    this.state.mode = 'manual';
    this.persist();
  },
  setAuto(){
    this.state.mode = 'auto';
    this.persist();
  },
  setMarkup(pct){
    Settings.set({ markupPercent: pct });
  },
};

/* ------------------------------ Toasts ------------------------------------*/
function toast(message, kind){
  kind = kind || 'info';
  const theme = {
    info:    { icon:'info',          cls:'border-sky-500/30 text-sky-100' },
    success: { icon:'check-circle-2',cls:'border-emerald-500/30 text-emerald-100' },
    error:   { icon:'alert-triangle',cls:'border-red-500/30 text-red-100' },
  }[kind] || { icon:'info', cls:'border-sky-500/30 text-sky-100' };
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = `toast-in glass-strong ${theme.cls} rounded-xl px-4 py-3 shadow-2xl flex items-start gap-2.5 text-sm w-full pointer-events-auto`;
  el.innerHTML = `<i data-lucide="${theme.icon}" class="w-4 h-4 mt-0.5 shrink-0"></i><span class="leading-snug">${esc(message)}</span>`;
  root.appendChild(el);
  if(window.lucide) lucide.createIcons({ nodes:[el] });
  setTimeout(()=>{
    el.style.transition = 'opacity .25s ease, transform .25s ease';
    el.style.opacity = '0'; el.style.transform = 'translateY(6px)';
    setTimeout(()=> el.remove(), 260);
  }, 3400);
}

/* =========================================================================
   Lógica de negocio: métricas
   ========================================================================= */
function txInRange(transactions, fromISODate, toISODate){
  return transactions.filter(t => {
    const d = t.date.slice(0,10);
    return d >= fromISODate && d <= toISODate;
  });
}
function sumByType(list, type){
  return list.filter(t=>t.type===type).reduce((s,t)=>s+Number(t.total||0),0);
}
function getLowStock(products){
  return products.filter(p => p.stock <= p.minStock).sort((a,b)=>a.stock-b.stock);
}
function rangeForFilter(filter){
  const today = todayStr();
  if(filter === 'hoy') return [today, today];
  if(filter === 'semana'){
    const d = new Date(); d.setDate(d.getDate()-6);
    return [d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'), today];
  }
  if(filter === 'mes'){
    const d = new Date(); d.setDate(d.getDate()-29);
    return [d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'), today];
  }
  return ['0000-00-00', '9999-99-99'];
}

/* =========================================================================
   Lógica de negocio: Reportes diarios
   ========================================================================= */
function composeLocalSummary(m){
  const { date, totalSales, totalCostOfSales, totalExpenses, netProfit, salesCount, topProducts, lowStockAlerts } = m;
  const grossMargin = totalSales > 0 ? ((totalSales - totalCostOfSales) / totalSales * 100) : 0;
  const p = [];

  if(salesCount === 0){
    p.push(`El día ${fmtDateShort(date)} no registró ventas de mostrador. Los gastos operativos del día sumaron ${fmtUSD(totalExpenses)}, lo que representa una jornada de baja actividad comercial que conviene revisar: ¿hubo cierre parcial, feriado, o baja afluencia de clientes?`);
  } else {
    p.push(`El día ${fmtDateShort(date)} se registraron ${salesCount} venta(s) de mostrador por un total de ${fmtUSD(totalSales)} (${fmtBs(Rate.toBs(totalSales))}), con un costo de mercancía vendida de ${fmtUSD(totalCostOfSales)}. El margen bruto del día fue de ${grossMargin.toFixed(1)}%.`);
  }

  if(totalExpenses > 0){
    p.push(`Los gastos operativos y compras del día ascendieron a ${fmtUSD(totalExpenses)} (${fmtBs(Rate.toBs(totalExpenses))}). ${netProfit >= 0 ? 'A pesar de estos gastos, la utilidad neta se mantuvo positiva en ' + fmtUSD(netProfit) + ', una jornada saludable para el negocio.' : 'Esto llevó la utilidad neta del día a un resultado negativo de ' + fmtUSD(Math.abs(netProfit)) + '. Conviene revisar si se trató de un gasto puntual (servicios, reposición grande de inventario) antes de tomar acciones correctivas.'}`);
  } else if(salesCount > 0){
    p.push(`No se registraron gastos operativos en el día, por lo que la utilidad neta coincide con el margen bruto: ${fmtUSD(netProfit)} (${fmtBs(Rate.toBs(netProfit))}).`);
  }

  if(topProducts && topProducts.length){
    const top = topProducts[0];
    p.push(`El producto de mayor movimiento fue "${top.name}" con ${top.quantity} unidad(es) vendidas (${fmtUSD(top.revenue)} en ingresos). ${topProducts.length > 1 ? 'Le siguieron ' + topProducts.slice(1,3).map(t=>`"${t.name}"`).join(' y ') + '.' : ''}`);
  }

  if(lowStockAlerts && lowStockAlerts.length){
    p.push(`Atención: ${lowStockAlerts.length} producto(s) están en o por debajo de su stock mínimo (${lowStockAlerts.slice(0,3).join('; ')}${lowStockAlerts.length>3?'; entre otros':''}). Se recomienda planificar reabastecimiento antes de que se agote la existencia.`);
  } else {
    p.push(`El inventario se encuentra en niveles saludables, sin alertas de stock mínimo pendientes por atender.`);
  }

  return p.join('\n\n');
}

async function generateReport(dateStr){
  const products = DB.getProducts();
  const transactions = DB.getTransactions().filter(t=>t.date.startsWith(dateStr));

  let totalSales=0, totalCostOfSales=0, totalExpenses=0;
  const salesCount = transactions.filter(t=>t.type==='sale').length;
  const itemMap = {};
  transactions.forEach(t=>{
    if(t.type==='sale'){
      totalSales += t.total;
      (t.items||[]).forEach(it=>{
        totalCostOfSales += it.cost * it.quantity;
        if(!itemMap[it.name]) itemMap[it.name] = { qty:0, rev:0 };
        itemMap[it.name].qty += it.quantity;
        itemMap[it.name].rev += it.price * it.quantity;
      });
    } else if(t.type==='expense'){
      totalExpenses += t.total;
    }
  });
  const netProfit = totalSales - totalCostOfSales - totalExpenses;
  const topProducts = Object.entries(itemMap).map(([name,d])=>({name, quantity:d.qty, revenue:d.rev}))
    .sort((a,b)=>b.quantity-a.quantity).slice(0,5);
  const lowStockAlerts = getLowStock(products).map(p=>`${p.name} (stock: ${p.stock}, mínimo: ${p.minStock})`);

  const metrics = { date:dateStr, totalSales, totalCostOfSales, totalExpenses, netProfit, salesCount, topProducts, lowStockAlerts };
  let summary = composeLocalSummary(metrics);
  let source = 'local';

  if(Settings.data.geminiApiKey){
    try{
      const aiSummary = await withTimeout(callGeminiReportSummary(metrics), 9000);
      if(aiSummary){ summary = aiSummary; source = 'gemini'; }
    }catch(e){ console.warn('Resumen IA no disponible, se usa el resumen automático local.', e); }
  }

  const report = { id:dateStr, date:dateStr, totalSales, totalCostOfSales, totalExpenses, netProfit, salesCount, topProducts, summary, summarySource: source, generatedAt: new Date().toISOString() };
  DB.saveReport(report);
  return report;
}

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_,reject)=> setTimeout(()=>reject(new Error('timeout')), ms))
  ]);
}

function renderModal(){
  const m = UI.modal;
  if(!m) return '';
  if(m.type === 'product') return renderProductModal(m.data);
  if(m.type === 'transaction') return renderTransactionModal(m.txType, m.data);
  if(m.type === 'user') return renderUserModal(m.data);
  return '';
}

function closeModal(){ UI.modal = null; renderApp(); }

/* =========================================================================
   Utilidades de modal: previsualizaciones en vivo + generador de código
   ========================================================================= */
function generateProductCode(name){
  const clean = String(name||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,'');
  const prefix = (clean.substring(0,4) || 'PROD').padEnd(3,'X');
  let code, attempts = 0;
  const existing = new Set(DB.getProducts().map(p=>p.code.toUpperCase()));
  do{
    const rand = Math.floor(Math.random()*900+100);
    code = `${prefix}-${rand}`;
    attempts++;
  } while(existing.has(code) && attempts < 20);
  return code;
}

function wireModalEvents(){
  const m = UI.modal;
  if(!m) return;

  if(m.type === 'transaction' && m.txType === 'sale'){
    const sel = document.getElementById('sale-product-select');
    const qty = document.getElementById('sale-qty');
    const preview = document.getElementById('sale-total-preview');
    const desc = document.querySelector('#tx-form [name="description"]');
    const update = ()=>{
      const opt = sel.options[sel.selectedIndex];
      const price = opt ? Number(opt.dataset.price||0) : 0;
      const stock = opt ? Number(opt.dataset.stock||0) : 0;
      const q = Math.max(1, Number(qty.value||1));
      const total = price * q;
      if(preview) preview.textContent = sel.value ? `${fmtUSD(total)} · ${fmtBs(Rate.toBs(total))}` : '—';
      if(sel.value && desc && !desc.dataset.userEdited){ desc.value = `Venta de ${opt.text.split(' (')[0]}`; }
      if(sel.value && q > stock){ preview.classList.add('text-red-400'); preview.classList.remove('text-emerald-300'); }
      else { preview.classList.remove('text-red-400'); preview.classList.add('text-emerald-300'); }
    };
    if(sel){ sel.addEventListener('change', update); qty.addEventListener('input', update); if(desc) desc.addEventListener('input', ()=> desc.dataset.userEdited = '1'); update(); }
  }

  if(m.type === 'transaction' && m.txType === 'inventory_entry'){
    const sel = document.getElementById('entry-product-select');
    const qty = document.getElementById('entry-qty');
    const cost = document.getElementById('entry-cost');
    const preview = document.getElementById('entry-total-preview');
    const update = ()=>{
      const opt = sel.options[sel.selectedIndex];
      if(opt && opt.dataset.cost && !cost.dataset.userEdited) cost.value = opt.dataset.cost;
      const c = Number(cost.value||0);
      const q = Math.max(1, Number(qty.value||1));
      preview.textContent = sel.value ? `Total: ${fmtUSD(c*q)}` : 'Total: —';
    };
    if(sel){ sel.addEventListener('change', update); qty.addEventListener('input', update); cost.addEventListener('input', ()=>{ cost.dataset.userEdited='1'; update(); }); update(); }
  }
}

/* =========================================================================
   MOTOR DE VOZ — funciona 100% local (sin IA externa). Si el usuario
   configura una clave de Gemini, se usa solo para redactar mejor la
   respuesta ya calculada (nunca para inventar datos ni ejecutar acciones).
   ========================================================================= */
const SPANISH_NUMBERS = {
  cero:0, un:1, uno:1, una:1, dos:2, tres:3, cuatro:4, cinco:5, seis:6, siete:7, ocho:8, nueve:9, diez:10,
  once:11, doce:12, trece:13, catorce:14, quince:15, dieciseis:16, diecisiete:17, dieciocho:18, diecinueve:19,
  veinte:20, veintiuno:21, veintidos:22, veintitres:23, veinticuatro:24, veinticinco:25, veintiseis:26,
  treinta:30, cuarenta:40, cincuenta:50, sesenta:60, setenta:70, ochenta:80, noventa:90, cien:100,
};
function extractQuantity(norm){
  const digitMatch = norm.match(/\d+/);
  if(digitMatch) return parseInt(digitMatch[0],10);
  const words = norm.split(' ');
  for(const w of words){ if(SPANISH_NUMBERS[w] !== undefined) return SPANISH_NUMBERS[w]; }
  return null;
}
function extractExplicitCode(norm){
  const m = norm.match(/codigo\s+([a-z0-9\-]{2,})/);
  return m ? m[1].toUpperCase() : null;
}
function matchProducts(norm){
  const products = DB.getProducts();
  const explicitCode = extractExplicitCode(norm);
  const scored = [];
  for(const p of products){
    let score = 0;
    const nName = normalize(p.name);
    const nCode = normalize(p.code);
    if(explicitCode && nCode === normalize(explicitCode)) score = 100;
    else if(norm.split(' ').includes(nCode)) score = 90;
    else if(norm.includes(nName)) score = 80;
    else {
      const words = nName.split(' ').filter(w=>w.length>=4);
      const hit = words.filter(w=>norm.includes(w)).length;
      if(hit > 0) score = 40 + (hit/words.length)*30;
    }
    if(score > 0) scored.push({ product:p, score });
  }
  return scored.sort((a,b)=>b.score-a.score).slice(0,5);
}
const SALE_WORDS = ['vender','vendi','vendimos','venda','vendo','despachar','despacho','sali','salio','salida de'];
const ENTRY_WORDS = ['entrar','entrada','entro','recibir','recibi','cargar','cargue','reabastecer','reponer','comprar','compre','ingresar','ingreso','meter stock','sumar stock','agregar al inventario','agregar stock'];
const ACCOUNTING_WORDS = ['cuanto vendimos','ventas del dia','venta del dia','ganancia','ganancias','utilidad','cuanto hemos vendido','resumen del dia','como va la caja','cuanto llevamos','estado de cuentas','finanzas'];
const STOCK_QUERY_WORDS = ['tenemos','hay','tienes','disponible','existencia','cuanto queda','cuantos quedan','donde esta','ubicacion','precio de','cuanto cuesta','cuesta','stock de'];

function detectIntent(norm){
  if(ACCOUNTING_WORDS.some(w=>norm.includes(w))) return 'accounting_status';
  if(SALE_WORDS.some(w=>norm.includes(w))) return 'sale_action';
  if(ENTRY_WORDS.some(w=>norm.includes(w))) return 'entry_action';
  return null;
}

function processVoiceQuery(rawQuery){
  const norm = normalize(rawQuery);
  if(!norm) return null;
  const intent = detectIntent(norm);
  const qty = extractQuantity(norm) || 1;
  const matches = matchProducts(norm);
  const today = todayStr();

  // 1) Estado contable del día
  if(intent === 'accounting_status'){
    const todayTx = txInRange(DB.getTransactions(), today, today);
    const sales = sumByType(todayTx,'sale');
    const expenses = sumByType(todayTx,'expense');
    const net = sales - expenses;
    return {
      kind:'accounting_status',
      answer: `Resumen contable de hoy: ventas por ${fmtUSD(sales)} (${fmtBs(Rate.toBs(sales))}), gastos por ${fmtUSD(expenses)} (${fmtBs(Rate.toBs(expenses))}). Utilidad del día: ${fmtUSD(net)} (${fmtBs(Rate.toBs(net))}).`,
      spokenAnswer: `Hoy llevamos ventas por ${sales.toFixed(0)} dólares y gastos por ${expenses.toFixed(0)} dólares. La utilidad del día es de ${net.toFixed(0)} dólares.`,
      matches: [],
      pending: null,
    };
  }

  // 2) Acción de venta
  if(intent === 'sale_action'){
    const best = matches[0];
    if(!best){
      return { kind:'unknown', answer:`Entendí que quieres registrar una venta, pero no identifiqué el producto. Intenta mencionar su nombre o código, ej: "vender 2 martillos".`, spokenAnswer:'No identifiqué el producto. Intenta de nuevo mencionando su nombre.', matches:[], pending:null };
    }
    const p = best.product;
    if(p.stock < qty){
      return { kind:'search_product', answer:`No puedo registrar la venta de ${qty} unidad(es) de **${p.name}** porque solo quedan **${p.stock} unidades**.`, spokenAnswer:`No hay suficiente existencia. Solo quedan ${p.stock} unidades de ${p.name}.`, matches:[{product:p}], pending:null };
    }
    const total = p.price * qty;
    return {
      kind:'confirm_sale',
      answer: `¿Confirmas la venta de **${qty} unidad(es)** de **${p.name}** por **${fmtUSD(total)}** (${fmtBs(Rate.toBs(total))})?`,
      spokenAnswer: `¿Confirmas la venta de ${qty} unidades de ${p.name} por ${total.toFixed(2)} dólares?`,
      matches:[{product:p}],
      pending: { type:'sale', productId:p.id, productName:p.name, quantity:qty, total },
    };
  }

  // 3) Acción de entrada de inventario / posible alta de producto nuevo
  if(intent === 'entry_action'){
    const best = matches[0];
    if(best){
      const p = best.product;
      const totalCost = p.cost * qty;
      return {
        kind:'confirm_entry',
        answer: `¿Confirmas agregar **${qty} unidad(es)** de **${p.name}** al inventario (costo estimado ${fmtUSD(totalCost)})?`,
        spokenAnswer: `¿Confirmas agregar ${qty} unidades de ${p.name} al inventario?`,
        matches:[{product:p}],
        pending: { type:'inventory_entry', productId:p.id, productName:p.name, quantity:qty, totalCost },
      };
    }
    // No existe: preparar creación (abre el formulario prellenado, nunca se crea solo)
    const explicitCode = extractExplicitCode(norm);
    let candidateName = norm
      .replace(/\d+/g,'')
      .replace(new RegExp(ENTRY_WORDS.join('|'),'g'),'')
      .replace(/codigo\s+[a-z0-9\-]+/g,'')
      .replace(/\s+/g,' ').trim();
    candidateName = candidateName ? candidateName.replace(/\b\w/g, c=>c.toUpperCase()) : '';
    return {
      kind:'create_product',
      answer: `No encontré ese producto en el inventario. Voy a abrir el formulario con los datos que entendí para que los confirmes y lo agregues.`,
      spokenAnswer: `Ese producto no existe todavía. Abriendo formulario para crearlo.`,
      matches:[],
      pending: { type:'create_product', name:candidateName, code:explicitCode||'', stock:qty },
    };
  }

  // 4) Solo consulta (sin verbo de acción) → buscar producto
  if(matches.length){
    const p = matches[0].product;
    const priceBs = Rate.toBs(p.price);
    return {
      kind:'search_product',
      answer: `Sí, tenemos **${p.name}**. Quedan **${p.stock} unidades** en **${p.location}**, a **${fmtUSD(p.price)}** (${fmtBs(priceBs)}) cada una.`,
      spokenAnswer: `Sí, del producto ${p.name} quedan ${p.stock} unidades en ${p.location}. El precio es de ${p.price.toFixed(2)} dólares.`,
      matches,
      pending: null,
    };
  }

  // 5) Nada coincide
  return {
    kind:'unknown',
    answer: `No encontré productos o comandos que coincidan con "${rawQuery}". Intenta algo como: "¿tenemos martillos?", "vender 2 tornillos" o "entrar 10 clavos".`,
    spokenAnswer: `No logré entender la consulta. Intenta con otra frase.`,
    matches:[],
    pending:null,
  };
}

function commitPendingVoiceAction(pending){
  const user = Session.get();
  if(pending.type === 'sale'){
    const p = DB.getProducts().find(x=>x.id===pending.productId);
    if(!p || p.stock < pending.quantity){ toast('El stock cambió, ya no es posible completar esta venta.', 'error'); return false; }
    DB.saveTransaction({
      id: uid('tx'), type:'sale', date: new Date().toISOString(),
      description: `Venta por comando de voz de ${p.name}`, category:'Ventas', total: p.price*pending.quantity,
      items:[{ productId:p.id, name:p.name, quantity:pending.quantity, price:p.price, cost:p.cost }],
      userCode: user.code, userName: user.name + ' (voz)',
    });
    toast(`Venta registrada: ${pending.quantity}× ${p.name}`, 'success');
    return true;
  }
  if(pending.type === 'inventory_entry'){
    const p = DB.getProducts().find(x=>x.id===pending.productId);
    if(!p) return false;
    DB.saveTransaction({
      id: uid('tx'), type:'inventory_entry', date: new Date().toISOString(),
      description: `Entrada por comando de voz de ${p.name}`, category:'Compras de Inventario', total: p.cost*pending.quantity,
      items:[{ productId:p.id, name:p.name, quantity:pending.quantity, price:p.price, cost:p.cost }],
      userCode: user.code, userName: user.name + ' (voz)',
    });
    toast(`Inventario actualizado: +${pending.quantity} ${p.name}`, 'success');
    return true;
  }
  return false;
}

/* =========================================================================
   Reconocimiento de voz (Web Speech API) + síntesis de voz + IA opcional
   ========================================================================= */
let recognition = null;
function setupSpeechRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ UI.voice.supported = false; return; }
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'es-VE';

  recognition.onstart = () => {
    UI.voice.listening = true; UI.voice.transcript=''; UI.voice.interim=''; UI.voice.error=null; UI.voice.lastResult=null;
    if(window.speechSynthesis) speechSynthesis.cancel();
    refreshVoicePanel();
  };
  recognition.onresult = (e) => {
    let interim='', final='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    if(final) UI.voice.transcript = final;
    UI.voice.interim = interim;
    refreshVoicePanel();
  };
  recognition.onerror = (e) => {
    UI.voice.listening = false;
    UI.voice.error = e.error === 'not-allowed' ? 'Permiso de micrófono denegado. Habilítalo en la configuración de tu navegador.' : ('Error de reconocimiento: ' + e.error);
    refreshVoicePanel();
  };
  recognition.onend = () => {
    UI.voice.listening = false;
    refreshVoicePanel();
    if(UI.voice.transcript) handleVoiceQuery(UI.voice.transcript);
  };
}

function toggleListen(){
  if(!UI.voice.supported){
    UI.voice.error = 'Tu navegador no soporta control por voz. Usa Google Chrome o Safari.';
    refreshVoicePanel();
    return;
  }
  if(!recognition) setupSpeechRecognition();
  if(!recognition){ return; }
  if(UI.voice.listening){ recognition.stop(); }
  else { try{ recognition.start(); }catch(e){ console.error(e); } }
}

async function handleVoiceQuery(text){
  if(!text || !text.trim()) return;
  UI.voice.loading = true; UI.voice.error = null;
  refreshVoicePanel();

  let result = processVoiceQuery(text);

  if(result && Settings.data.geminiApiKey){
    try{
      const enhanced = await withTimeout(callGeminiVoiceAnswer(text, result), 7000);
      if(enhanced && enhanced.answer && enhanced.spokenAnswer){
        result = Object.assign({}, result, { answer: enhanced.answer, spokenAnswer: enhanced.spokenAnswer });
      }
    }catch(e){ console.warn('Respuesta IA no disponible, se usa el motor local.', e); }
  }

  UI.voice.loading = false;
  UI.voice.lastResult = result;
  refreshVoicePanel();
  if(Settings.data.ttsEnabled && result) speak(result.spokenAnswer || result.answer);
}

function speak(text){
  if(!text || !window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\*\*/g,''));
    u.lang = 'es-ES';
    speechSynthesis.speak(u);
  }catch(e){ console.warn('Síntesis de voz no disponible', e); }
}

/* ---- Integración opcional con Gemini (redacción, no ejecución) ---------- */
async function geminiCall(prompt){
  const key = Settings.data.geminiApiKey;
  const model = Settings.data.geminiModel || 'gemini-2.5-flash';
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'x-goog-api-key': key },
    body: JSON.stringify({ contents:[{ parts:[{ text: prompt }] }] }),
  });
  if(!res.ok) throw new Error('Gemini HTTP ' + res.status);
  const json = await res.json();
  const parts = json && json.candidates && json.candidates[0] && json.candidates[0].content && json.candidates[0].content.parts;
  const text = parts ? parts.map(p=>p.text||'').join('') : '';
  if(!text.trim()) throw new Error('Respuesta vacía de Gemini');
  return text.trim();
}
async function callGeminiVoiceAnswer(query, result){
  const prompt = `Eres el asistente de voz de una ferretería venezolana. Reformula la siguiente respuesta YA CALCULADA para que suene natural y amable en español, sin inventar ni alterar ningún dato numérico.
Consulta original: "${query}"
Datos calculados (fuente de verdad, no los cambies): ${JSON.stringify({ answer:result.answer, spokenAnswer:result.spokenAnswer })}
Devuelve SOLO un JSON válido, sin texto adicional ni markdown, con este formato exacto:
{"answer":"...","spokenAnswer":"..."}
"answer" puede usar **negritas**. "spokenAnswer" debe ser texto corto sin símbolos, apto para lectura en voz alta.`;
  const text = await geminiCall(prompt);
  const cleaned = text.replace(/```json|```/g,'').trim();
  const parsed = JSON.parse(cleaned);
  if(!parsed.answer || !parsed.spokenAnswer) throw new Error('Formato de respuesta inesperado');
  return parsed;
}
async function callGeminiReportSummary(m){
  const prompt = `Genera un resumen ejecutivo profesional en español (3 a 4 párrafos, texto fluido, sin markdown ni títulos) para el cierre diario de una ferretería venezolana.
Datos del día ${m.date}: ventas totales $${m.totalSales.toFixed(2)}, costo de ventas $${m.totalCostOfSales.toFixed(2)}, gastos $${m.totalExpenses.toFixed(2)}, utilidad neta $${m.netProfit.toFixed(2)}, número de ventas ${m.salesCount}.
Productos más vendidos: ${JSON.stringify(m.topProducts)}.
Alertas de stock bajo: ${m.lowStockAlerts.length ? m.lowStockAlerts.join('; ') : 'ninguna'}.
Tono directo, profesional y útil para el dueño del negocio. No inventes cifras fuera de las provistas.`;
  return await geminiCall(prompt);
}

function quickStock(id, delta){
  const p = DB.getProducts().find(x=>x.id===id);
  if(!p) return;
  const user = Session.get();
  if(delta > 0){
    p.stock += delta;
    DB.saveProduct(p);
    DB.saveTransaction({ id:uid('tx'), type:'inventory_entry', date:new Date().toISOString(),
      description:`Entrada rápida de inventario: ${p.name}`, category:'Compras de Inventario', total:p.cost*delta,
      items:[{ productId:p.id, name:p.name, quantity:delta, price:p.price, cost:p.cost }],
      userCode:user.code, userName:user.name });
    toast(`+${delta} unidad(es) de ${p.name}`, 'success');
  } else {
    if(p.stock <= 0){ toast('El stock ya está en cero.', 'error'); return; }
    p.stock = Math.max(0, p.stock + delta);
    DB.saveProduct(p);
    toast(`Corrección de stock: ${p.name} → ${p.stock} u.`, 'info');
  }
  refreshProductList();
}
function shareProduct(id){
  const p = DB.getProducts().find(x=>x.id===id);
  if(!p) return;
  const priceBs = Rate.toBs(p.price);
  const text = `🔩 *FERRETERÍA EL TORNILLO*\n\n📌 *Producto:* ${p.name}\n🏷️ *Código:* ${p.code}\n📁 *Categoría:* ${p.category}\n📍 *Ubicación:* ${p.location}\n\n💵 *Precio:* ${fmtUSD(p.price)} / *${fmtBs(priceBs)}*\n📦 *Disponibilidad:* ${p.stock>0?`✅ ${p.stock} unidades`:'❌ Agotado'}\n\n_(Tasa: ${fmtBs(Rate.sellRate())} /USD)_`;
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}

function openTransactionModal(txType){ UI.modal = { type:'transaction', txType: txType, data:null }; renderApp(); }
async function deleteTx(id){
  const ok = await askConfirm('Eliminar movimiento', 'Esto revertirá el efecto en el inventario si corresponde. ¿Continuar?', 'Eliminar', true);
  if(ok){ DB.deleteTransaction(id); toast('Movimiento eliminado.', 'info'); refreshTransactionList(); }
}
function shareTx(id){
  const t = DB.getTransactions().find(x=>x.id===id);
  if(!t) return;
  const isSale = t.type === 'sale';
  const items = t.items ? t.items.map(i=>`• ${i.quantity}× ${i.name} (${fmtUSD(i.price)} c/u)`).join('\n') : '';
  const text = `🧾 *COMPROBANTE - FERRETERÍA EL TORNILLO*\n\n📋 *Tipo:* ${isSale?'Venta':(t.type==='expense'?'Gasto':'Entrada de inventario')}\n📅 *Fecha:* ${fmtDateTime(t.date)}\n👤 *Atendido por:* ${t.userName||'Sistema'}\n\n📝 ${t.description}\n${items}\n\n💰 *TOTAL:* ${fmtUSD(t.total)} / *${fmtBs(Rate.toBs(t.total))}*\n_(Tasa: ${fmtBs(Rate.sellRate())} /USD)_`;
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}

function openUserModal(){ if(!isAdmin(Session.get())) return; UI.modal = { type:'user', data:null }; renderApp(); }
function editUser(code){ if(!isAdmin(Session.get())) return; const u = DB.getUserByCode(code); if(u){ UI.modal = { type:'user', data:u }; renderApp(); } }
async function deleteUserAction(code){
  const current = Session.get();
  if(current.code === code){ toast('No puedes eliminar tu propio código mientras estás en sesión.', 'error'); return; }
  const ok = await askConfirm('Eliminar acceso', 'El personal asociado ya no podrá ingresar con este PIN. ¿Continuar?', 'Eliminar', true);
  if(ok){ DB.deleteUser(code); toast('Acceso eliminado.', 'info'); renderApp(); }
}

function setRateMode(mode){ Rate.state.mode = mode; Rate.persist(); renderApp(); }
function saveMarkup(){
  const el = document.getElementById('markup-input');
  const val = parseFloat(el.value);
  if(isNaN(val) || val < 0){ toast('Margen inválido.', 'error'); return; }
  Rate.setMarkup(val);
  toast(`Margen actualizado a +${val}%.`, 'success');
  renderApp();
}
function saveManualRate(){
  const el = document.getElementById('manual-rate-input');
  const val = parseFloat(el.value);
  if(isNaN(val) || val <= 0){ toast('Tasa inválida.', 'error'); return; }
  Rate.setManual(val);
  toast('Tasa manual guardada.', 'success');
  renderApp();
}
async function refreshRateAction(){
  UI.refreshingRate = true; renderApp();
  const res = await Rate.fetchBcv();
  UI.refreshingRate = false;
  if(res.ok) toast(`Tasa BCV actualizada: Bs. ${res.rate.toFixed(2)}`, 'success');
  else toast('No se pudo conectar con la fuente de la tasa. Se mantiene el último valor conocido.', 'error');
  renderApp();
}
function toggleAiPanel(){ UI.aiPanelOpen = !UI.aiPanelOpen; renderApp(); }
function saveGeminiSettings(){
  const key = document.getElementById('gemini-key-input').value.trim();
  const model = document.getElementById('gemini-model-input').value.trim() || 'gemini-2.5-flash';
  Settings.set({ geminiApiKey:key, geminiModel:model });
  toast(key ? 'Clave de IA guardada en este navegador.' : 'Clave de IA eliminada. Se usará el motor local.', 'success');
  renderApp();
}
function shareApp(){
  const url = window.location.href;
  const text = `🛠️ *Ferretería El Tornillo — Contabilidad e Inventario*\n\nAccede a la aplicación desde este enlace:\n${url}`;
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}
function shareReport(id){
  const r = DB.getReports().find(x=>x.id===id);
  if(!r) return;
  const top = (r.topProducts||[]).map(p=>`• ${p.name}: ${p.quantity}u ($${p.revenue.toFixed(2)})`).join('\n') || 'Sin ventas registradas';
  const text = `📊 *REPORTE DIARIO - FERRETERÍA EL TORNILLO*\n📅 *Fecha:* ${r.date}\n\n💵 *Ventas:* ${fmtUSD(r.totalSales)} (${fmtBs(Rate.toBs(r.totalSales))})\n📦 *Costo de ventas:* ${fmtUSD(r.totalCostOfSales)}\n💸 *Gastos:* ${fmtUSD(r.totalExpenses)}\n📈 *Utilidad neta:* ${fmtUSD(r.netProfit)} (${fmtBs(Rate.toBs(r.netProfit))})\n\n🔥 *Top productos:*\n${top}\n\n${r.summary}\n\n_(Tasa: ${fmtBs(Rate.sellRate())} /USD)_`;
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}
async function generateReportAction(){
  const dateInput = document.getElementById('report-date');
  const date = dateInput ? dateInput.value : UI.reportDate;
  UI.reportDate = date;
  UI.generatingReport = true; renderApp();
  try{
    await generateReport(date);
    toast('Reporte generado correctamente.', 'success');
  }catch(e){
    console.error(e);
    toast('Ocurrió un error al generar el reporte.', 'error');
  } finally {
    UI.generatingReport = false; renderApp();
  }
}
function logout(){ Session.clear(); UI.activeTab = 'dashboard'; UI.modal = null; renderApp(); }
function genCodeAction(){
  const form = document.getElementById('product-form');
  if(!form) return;
  const name = form.querySelector('[name="name"]').value;
  const codeInput = document.getElementById('product-code-input');
  codeInput.value = generateProductCode(name || 'PROD');
}

/* =========================================================================
   DELEGACIÓN DE EVENTOS
   ========================================================================= */
const debouncedRefreshProducts = debounce(refreshProductList, 120);

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  // Los contenedores de fondo (modales/paneles) solo deben actuar si el clic fue
  // literalmente sobre el fondo, no sobre un descendiente (tarjeta interna, botón, etc.)
  if(el.hasAttribute('data-backdrop') && e.target !== el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  switch(action){
    case 'setTab': setTab(el.dataset.tab); break;
    case 'openVoice': openVoice(); break;
    case 'closeVoice': closeVoice(); break;
    case 'toggleListen': toggleListen(); break;
    case 'confirmVoiceAction': confirmVoiceAction(); break;
    case 'cancelVoiceAction': cancelVoiceAction(); break;
    case 'voiceGoToProduct': voiceGoToProduct(id); break;
    case 'refreshRate': refreshRateAction(); break;

    case 'openTransactionModal': openTransactionModal(el.dataset.txtype); break;
    case 'shareTx': shareTx(id); break;
    case 'deleteTx': deleteTx(id); break;

    case 'quickStock': quickStock(id, parseInt(el.dataset.delta,10)); break;
    case 'shareProduct': shareProduct(id); break;
    case 'editProduct': editProduct(id); break;
    case 'deleteProduct': deleteProductAction(id); break;
    case 'openProductModal': openProductModal(null); break;
    case 'genCode': genCodeAction(); break;

    case 'closeModal': closeModal(); break;
    case 'setTxFilter': UI.txFilter = el.dataset.filter; renderApp(); break;

    case 'setRateMode': setRateMode(el.dataset.mode); break;
    case 'saveMarkup': saveMarkup(); break;
    case 'saveManualRate': saveManualRate(); break;

    case 'openUserModal': openUserModal(); break;
    case 'editUser': editUser(el.dataset.code); break;
    case 'deleteUser': deleteUserAction(el.dataset.code); break;

    case 'toggleAiPanel': toggleAiPanel(); break;
    case 'saveGeminiSettings': saveGeminiSettings(); break;
    case 'shareApp': shareApp(); break;
    case 'shareReport': shareReport(id); break;
    case 'generateReport': generateReportAction(); break;
    case 'logout': logout(); break;

    case 'confirmYes': resolveConfirm(true); break;
    case 'confirmNo': resolveConfirm(false); break;
  }
});

document.addEventListener('submit', function(e){
  const form = e.target;
  if(!form.dataset || !form.dataset.form) return;
  e.preventDefault();
  const type = form.dataset.form;
  const user = Session.get();

  if(type === 'login'){
    const pin = form.querySelector('[name="pin"]').value.trim();
    const found = DB.getUserByCode(pin);
    if(found){ Session.set(found); UI.loginError = null; renderApp(); }
    else { UI.loginError = 'Código incorrecto. Verifica con tu administrador.'; renderApp(); }
    return;
  }

  if(type === 'product'){
    const f = (name)=> form.querySelector(`[name="${name}"]`).value;
    const id = form.dataset.id || uid('prod');
    const product = {
      id,
      name: f('name').trim(),
      code: f('code').trim().toUpperCase(),
      description: f('description').trim(),
      category: f('category').trim(),
      price: parseFloat(f('price')) || 0,
      cost: parseFloat(f('cost')) || 0,
      stock: parseInt(f('stock'),10) || 0,
      minStock: parseInt(f('minStock'),10) || 0,
      location: f('location').trim(),
    };
    if(!product.name || !product.code){ toast('Completa nombre y código del producto.', 'error'); return; }
    DB.saveProduct(product);
    toast(form.dataset.id ? 'Producto actualizado.' : 'Producto agregado al inventario.', 'success');
    closeModal();
    return;
  }

  if(type === 'sale-tx'){
    const productId = form.querySelector('[name="productId"]').value;
    const quantity = parseInt(form.querySelector('[name="quantity"]').value, 10) || 1;
    const noteEl = form.querySelector('[name="description"]');
    if(!productId){ toast('Selecciona un producto.', 'error'); return; }
    const p = DB.getProducts().find(x=>x.id===productId);
    if(!p){ toast('Producto no encontrado.', 'error'); return; }
    if(p.stock < quantity){ toast(`Stock insuficiente. Quedan ${p.stock} unidades.`, 'error'); return; }
    const total = p.price * quantity;
    DB.saveTransaction({
      id: uid('tx'), type:'sale', date: new Date().toISOString(),
      description: (noteEl && noteEl.value.trim()) || `Venta de ${p.name}`, category:'Ventas', total,
      items:[{ productId:p.id, name:p.name, quantity, price:p.price, cost:p.cost }],
      userCode: user.code, userName: user.name,
    });
    toast('Venta registrada.', 'success');
    closeModal();
    return;
  }

  if(type === 'expense-tx'){
    const description = form.querySelector('[name="description"]').value.trim();
    const category = form.querySelector('[name="category"]').value.trim() || 'Gastos Operativos';
    const total = parseFloat(form.querySelector('[name="total"]').value);
    if(!description || !total || total <= 0){ toast('Completa la descripción y un monto válido.', 'error'); return; }
    DB.saveTransaction({ id: uid('tx'), type:'expense', date: new Date().toISOString(), description, category, total, userCode:user.code, userName:user.name });
    toast('Gasto registrado.', 'success');
    closeModal();
    return;
  }

  if(type === 'entry-tx'){
    const productId = form.querySelector('[name="productId"]').value;
    const quantity = parseInt(form.querySelector('[name="quantity"]').value, 10) || 1;
    const p = DB.getProducts().find(x=>x.id===productId);
    if(!p){ toast('Selecciona un producto.', 'error'); return; }
    const unitCostRaw = form.querySelector('[name="unitCost"]').value;
    const unitCost = unitCostRaw !== '' ? parseFloat(unitCostRaw) : p.cost;
    DB.saveTransaction({
      id: uid('tx'), type:'inventory_entry', date: new Date().toISOString(),
      description:`Entrada de inventario: ${p.name}`, category:'Compras de Inventario', total: unitCost*quantity,
      items:[{ productId:p.id, name:p.name, quantity, price:p.price, cost:unitCost }],
      userCode:user.code, userName:user.name,
    });
    toast('Entrada de inventario registrada.', 'success');
    closeModal();
    return;
  }

  if(type === 'user'){
    const name = form.querySelector('[name="name"]').value.trim();
    const code = form.querySelector('[name="code"]').value.trim();
    const role = form.querySelector('[name="role"]').value;
    const originalCode = form.dataset.originalCode;
    if(!name || !/^\d{4}$/.test(code)){ toast('El PIN debe tener exactamente 4 dígitos.', 'error'); return; }
    if(originalCode && originalCode !== code) DB.deleteUser(originalCode);
    DB.saveUser({ code, name, role });
    if(user && user.code === (originalCode || code)) Session.set({ code, name, role });
    toast('Acceso guardado.', 'success');
    closeModal();
    return;
  }

  if(type === 'voice-text'){
    const query = form.querySelector('[name="query"]').value.trim();
    if(!query) return;
    form.reset();
    submitVoiceText(query);
    return;
  }
});

document.addEventListener('input', function(e){
  if(e.target.id === 'inv-search'){
    UI.invSearch = e.target.value;
    debouncedRefreshProducts();
  }
});

document.addEventListener('change', function(e){
  if(e.target.id === 'inv-category'){ UI.invCategory = e.target.value; renderApp(); }
  if(e.target.id === 'tx-range'){ UI.txRange = e.target.value; renderApp(); }
  if(e.target.id === 'report-date'){ UI.reportDate = e.target.value; }
});

/* =========================================================================
   INICIALIZACIÓN
   ========================================================================= */
function afterRenderExtra(){
  if(UI.modal) wireModalEvents();
}
const _origAfterRender = afterRender;
afterRender = function(){ _origAfterRender(); afterRenderExtra(); };

async function init(){
  DB.load();
  Settings.load();
  Rate.load();
  renderApp();

  // Primer intento de obtener la tasa BCV (no bloquea la interfaz)
  Rate.fetchBcv().then(res=>{
    if(res.ok) renderApp();
  });
  // Actualización periódica de la tasa
  setInterval(()=>{ Rate.fetchBcv().then(res=>{ if(res.ok) renderApp(); }); }, RATE_REFRESH_MS);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
