<script>
"use strict";
/* =========================================================================
   PINTURAS VALLE FRESCO 230, S.R.L
   Sistema de Contabilidad, Inventario y Facturación en Tiempo Real
   Backend: Supabase (PostgreSQL)
   ========================================================================= */

/* ---- Constantes ---- */
const SUPABASE_URL     = 'https://zgpunnvzircazykgecex.supabase.co';
const SUPABASE_ANON    = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpncHVubnZ6aXJjYXp5a2dlY2V4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNjQ4ODksImV4cCI6MjEwMTk0MDg4OX0.3o2X3HuV8z0txIDmr01fXm1OesUz4wgBDK56S4CrQCU';
const SESSION_KEY      = 'pvf_session_v1';
const BCV_ENDPOINT     = 'https://ve.dolarapi.com/v1/dolares/oficial';
const RATE_REFRESH_MS  = 15 * 60 * 1000;
const DEFAULT_MARKUP   = 7;

/* ---- Cliente Supabase ---- */
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

/* ---- Utilidades ---- */
function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normalize(s){ return String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s.]/g,' ').replace(/\s+/g,' ').trim(); }
function fmtUSD(n){ return '$' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtBs(n){ if(n === null || n === undefined || isNaN(n)) return '—'; return 'Bs. ' + Number(n).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtQty(n){ const v = parseFloat(n||0); return Number.isInteger(v) ? v.toString() : v.toLocaleString('es-VE',{minimumFractionDigits:1,maximumFractionDigits:2}); }
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function getLocalYYYYMMDD(isoStr){
  if(!isoStr) return todayStr();
  try{
    const d = new Date(isoStr);
    if(isNaN(d.getTime())) return isoStr.slice(0,10);
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }catch(e){
    return isoStr.slice(0,10);
  }
}
function fmtDateShort(iso){ try{ return new Date(iso).toLocaleDateString('es-VE',{ day:'2-digit', month:'short', year:'numeric' }); }catch(e){ return iso; } }
function fmtDateTime(iso){ try{ return new Date(iso).toLocaleString('es-VE',{ day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }); }catch(e){ return iso; } }
function fmtTime(iso){ try{ return new Date(iso).toLocaleTimeString('es-VE',{ hour:'2-digit', minute:'2-digit' }); }catch(e){ return ''; } }
function debounce(fn, ms){ let t=null; return function(...args){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,args), ms); }; }
function toUpper(s){ return String(s||'').toUpperCase(); }

const CATEGORY_THEMES = [
  {bg:'bg-amber-500/15', text:'text-amber-300', ring:'ring-amber-500/30'},
  {bg:'bg-sky-500/15',   text:'text-sky-300',   ring:'ring-sky-500/30'},
  {bg:'bg-emerald-500/15',text:'text-emerald-300',ring:'ring-emerald-500/30'},
  {bg:'bg-violet-500/15',text:'text-violet-300',ring:'ring-violet-500/30'},
  {bg:'bg-rose-500/15',  text:'text-rose-300',  ring:'ring-rose-500/30'},
  {bg:'bg-teal-500/15',  text:'text-teal-300',  ring:'ring-teal-500/30'},
  {bg:'bg-indigo-500/15',text:'text-indigo-300',ring:'ring-indigo-500/30'},
  {bg:'bg-orange-500/15',text:'text-orange-300',ring:'ring-orange-500/30'},
];
function categoryTheme(cat){ let h=0; const s=String(cat||''); for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return CATEGORY_THEMES[h%CATEGORY_THEMES.length]; }
function categoryBadge(cat){ const t=categoryTheme(cat); return `<span class="badge ${t.bg} ${t.text} ring-1 ${t.ring}">${esc(cat)}</span>`; }

/* =========================================================================
   GENERADOR AUTOMÁTICO DE CÓDIGOS SKU (MÁXIMO 6 CARACTERES)
   ========================================================================= */
function generateProductCode(category, name) {
  const normCat = normalize(category);
  const normName = normalize(name);

  let prefix = 'PRD';
  if (normCat.includes('arena') || normName.includes('arena')) prefix = 'ARE';
  else if (normCat.includes('piedra') || normName.includes('piedra')) prefix = 'PIE';
  else if (normCat.includes('polvillo') || normName.includes('polvillo')) prefix = 'POL';
  else if (normCat.includes('cal') || normName.includes('cal')) prefix = 'CAL';
  else if (normCat.includes('latex') || normName.includes('latex')) prefix = 'LAT';
  else if (normCat.includes('esmalte') || normName.includes('esmalte')) prefix = 'ESM';
  else if (normCat.includes('base') || normCat.includes('anticorrosivo')) prefix = 'BAS';
  else if (normCat.includes('caucho') || normName.includes('caucho')) prefix = 'CAU';
  else if (normCat.includes('solvente') || normCat.includes('thinner')) prefix = 'SOL';
  else if (normCat.includes('accesorio') || normName.includes('brocha')) prefix = 'ACC';
  else if (normCat.includes('preparacion') || normName.includes('masilla')) prefix = 'PRE';
  else if (normCat.includes('especial') || normName.includes('trafico')) prefix = 'ESP';
  else if (normCat.includes('material') || normCat.includes('construccion')) prefix = 'MAT';
  else {
    const clean = category.trim().replace(/[^a-zA-Z]/g,'').toUpperCase();
    if(clean.length >= 3) prefix = clean.slice(0,3);
  }

  const existingCodes = new Set(DB.getProducts().map(p => (p.codigo||'').toUpperCase()));
  let num = Math.floor(Math.random() * 899 + 100);
  let generated = `${prefix}${String(num).padStart(3,'0')}`;
  
  let attempts = 0;
  while(existingCodes.has(generated) && attempts < 50) {
    num = Math.floor(Math.random() * 899 + 100);
    generated = `${prefix}${String(num).padStart(3,'0')}`;
    attempts++;
  }

  return generated.slice(0,6);
}

/* =========================================================================
   CAPA DE DATOS (Supabase)
   ========================================================================= */
const DB = {
  _products: [],
  _transactions: [],
  _reports: [],
  _users: [],
  _config: {},
  _loaded: false,

  async loadAll(){
    try{
      const [pRes, tRes, rRes, uRes, cRes] = await Promise.all([
        sb.from('productos').select('*').eq('activo', true).order('nombre'),
        sb.from('transacciones').select('*').order('fecha', {ascending:false}),
        sb.from('reportes').select('*').order('fecha', {ascending:false}),
        sb.from('usuarios').select('*').eq('activo', true).order('nombre'),
        sb.from('configuracion').select('*'),
      ]);
      this._products     = pRes.data || [];
      this._transactions = tRes.data || [];
      this._reports      = rRes.data || [];
      this._users        = uRes.data || [];
      this._config       = {};
      (cRes.data || []).forEach(r => { this._config[r.clave] = r.valor; });
      this._loaded = true;
    } catch(e){
      console.error('Error cargando datos de Supabase', e);
      toast('Error de conexión con la base de datos.', 'error');
    }
  },

  /* PRODUCTOS */
  getProducts(){ return this._products; },
  async saveProduct(p){
    const isNew = !p.id;
    const payload = {
      codigo: (p.codigo||'').slice(0,6).toUpperCase(),
      nombre: p.nombre, descripcion: p.descripcion || '', categoria: p.categoria,
      precio: parseFloat(p.precio)||0, costo: parseFloat(p.costo)||0,
      stock: parseFloat(p.stock)||0, stock_min: parseFloat(p.stock_min)||0,
      ubicacion: p.ubicacion, activo: true, actualizado_en: new Date().toISOString()
    };
    if(isNew){
      const { data, error } = await sb.from('productos').insert(payload).select().single();
      if(error) throw error;
      this._products.push(data);
      return data;
    } else {
      const { data, error } = await sb.from('productos').update(payload).eq('id', p.id).select().single();
      if(error) throw error;
      const i = this._products.findIndex(x=>x.id===p.id);
      if(i>=0) this._products[i] = data; else this._products.push(data);
      return data;
    }
  },
  async deleteProduct(id){
    const { error } = await sb.from('productos').update({activo:false}).eq('id', id);
    if(error) throw error;
    this._products = this._products.filter(p=>p.id!==id);
    return true;
  },
  async updateProductStock(id, delta){
    const prod = this._products.find(p=>p.id===id);
    if(!prod) return;
    const newStock = Math.max(0, parseFloat((parseFloat(prod.stock||0) + parseFloat(delta||0)).toFixed(2)));
    const { data, error } = await sb.from('productos').update({stock:newStock, actualizado_en:new Date().toISOString()}).eq('id',id).select().single();
    if(error) throw error;
    const i = this._products.findIndex(x=>x.id===id);
    if(i>=0) this._products[i] = data;
    return data;
  },

  /* TRANSACCIONES */
  getTransactions(){ return this._transactions; },
  async saveTransaction(tx){
    if(tx.items){
      for(const item of tx.items){
        const delta = tx.tipo === 'venta' ? -parseFloat(item.cantidad) : (tx.tipo === 'entrada_inventario' ? parseFloat(item.cantidad) : 0);
        if(delta !== 0) await this.updateProductStock(item.producto_id, delta);
      }
    }
    const { data, error } = await sb.from('transacciones').insert({
      tipo: tx.tipo, fecha: tx.fecha || new Date().toISOString(),
      descripcion: tx.descripcion || '', categoria: tx.categoria || '',
      total: tx.total, usuario_id: tx.usuario_id || null,
      usuario_nombre: tx.usuario_nombre || '', items: tx.items || null,
      numero_factura: tx.numero_factura || null,
    }).select().single();
    if(error) throw error;
    this._transactions.unshift(data);
    return data;
  },
  async deleteTransaction(id){
    const tx = this._transactions.find(t=>t.id===id);
    if(!tx) return false;
    if(tx.items){
      for(const item of tx.items){
        const delta = tx.tipo === 'venta' ? parseFloat(item.cantidad) : (tx.tipo === 'entrada_inventario' ? -parseFloat(item.cantidad) : 0);
        if(delta !== 0) await this.updateProductStock(item.producto_id, delta);
      }
    }
    const { error } = await sb.from('transacciones').delete().eq('id', id);
    if(error) throw error;
    this._transactions = this._transactions.filter(t=>t.id!==id);
    return true;
  },

  /* REPORTES */
  getReports(){ return this._reports; },
  async saveReport(r){
    const payload = {
      id: r.id, fecha: r.fecha, total_ventas: r.total_ventas,
      total_costo_ventas: r.total_costo_ventas, total_gastos: r.total_gastos,
      utilidad_neta: r.utilidad_neta, num_ventas: r.num_ventas,
      top_productos: r.top_productos, resumen: r.resumen,
      fuente_resumen: r.fuente_resumen || 'local',
      generado_en: new Date().toISOString()
    };
    const { data, error } = await sb.from('reportes').upsert(payload).select().single();
    if(error) throw error;
    const i = this._reports.findIndex(x=>x.id===r.id);
    if(i>=0) this._reports[i] = data; else this._reports.unshift(data);
    return data;
  },

  /* USUARIOS */
  getUsers(){ return this._users; },
  getUserByCode(code){ return this._users.find(u=>u.codigo===code); },
  async saveUser(u){
    const isNew = !u.id;
    const payload = { codigo: u.codigo, nombre: u.nombre, rol: u.rol, activo: true };
    if(isNew){
      const { data, error } = await sb.from('usuarios').insert(payload).select().single();
      if(error) throw error;
      this._users.push(data);
      return data;
    } else {
      const { data, error } = await sb.from('usuarios').update(payload).eq('id', u.id).select().single();
      if(error) throw error;
      const i = this._users.findIndex(x=>x.id===u.id);
      if(i>=0) this._users[i] = data;
      return data;
    }
  },
  async deleteUser(id){
    const { error } = await sb.from('usuarios').update({activo:false}).eq('id', id);
    if(error) throw error;
    this._users = this._users.filter(u=>u.id!==id);
    return true;
  },

  /* FACTURACIÓN */
  async nextInvoiceSerial(){
    try{
      const { data, error } = await sb.rpc('siguiente_numero_factura');
      if(error){ console.warn('No se pudo generar el número de factura automático (¿ejecutaste el SQL nuevo?).', error); return null; }
      return data || null;
    }catch(e){ console.warn('No se pudo generar el número de factura automático.', e); return null; }
  },

  /* CONFIGURACIÓN */
  getConfig(key, def){ return this._config[key] ?? def; },
  async setConfig(key, value){
    this._config[key] = String(value);
    const { error } = await sb.from('configuracion').upsert({clave:key, valor:String(value), actualizado_en:new Date().toISOString()});
    if(error) console.error('Error guardando config', error);
  },
};

/* =========================================================================
   SESIÓN Y TASA BCV
   ========================================================================= */
const Session = {
  get(){ try{ const r=localStorage.getItem(SESSION_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } },
  set(user){ localStorage.setItem(SESSION_KEY, JSON.stringify(user)); },
  clear(){ localStorage.removeItem(SESSION_KEY); },
};

const Rate = {
  state: { mode:'auto', bcvRate:null, bcvUpdatedAt:null, fetchedAt:null, manualRate:null, lastError:null },

  loadFromConfig(){
    this.state.mode       = DB.getConfig('modo_tasa', 'auto');
    this.state.manualRate = parseFloat(DB.getConfig('tasa_manual', '0')) || null;
  },
  markup(){ return parseFloat(DB.getConfig('margen_porcentaje', String(DEFAULT_MARKUP))) || DEFAULT_MARKUP; },
  sellRate(){
    if(this.state.mode==='manual'){
      return (this.state.manualRate && this.state.manualRate>0) ? this.state.manualRate : null;
    }
    if(this.state.bcvRate && this.state.bcvRate>0){
      return this.state.bcvRate * (1 + this.markup()/100);
    }
    return null;
  },
  toBs(usd){ const r=this.sellRate(); return r ? Number(usd||0)*r : null; },
  isStale(){ if(this.state.mode==='manual') return false; if(!this.state.fetchedAt) return true; return (Date.now()-new Date(this.state.fetchedAt).getTime())>(6*60*60*1000); },
  async fetchBcv(){
    try{
      const res = await fetch(BCV_ENDPOINT, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      const rate = Number(json.promedio ?? json.venta ?? json.compra);
      if(!rate || isNaN(rate) || rate<=0) throw new Error('Sin tasa válida');
      this.state.bcvRate = rate;
      this.state.bcvUpdatedAt = json.fechaActualizacion || null;
      this.state.fetchedAt = new Date().toISOString();
      this.state.lastError = null;
      return {ok:true, rate};
    }catch(err){
      this.state.lastError = (err&&err.message) ? err.message : 'Error de red';
      return {ok:false, error:this.state.lastError};
    }
  },
  async setManual(rate){

/* =========================================================================
   TOASTS & CONFIRMACIÓN
   ========================================================================= */
function toast(message, kind){
  kind = kind || 'info';
  const theme = {
    info:    {icon:'info',           cls:'border-sky-500/30 text-sky-100'},
    success: {icon:'check-circle-2', cls:'border-emerald-500/30 text-emerald-100'},
    error:   {icon:'alert-triangle', cls:'border-red-500/30 text-red-100'},
  }[kind] || {icon:'info', cls:'border-sky-500/30 text-sky-100'};
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = `toast-in glass-strong ${theme.cls} rounded-xl px-4 py-3 shadow-2xl flex items-start gap-2.5 text-sm w-full pointer-events-auto`;
  el.innerHTML = `<i data-lucide="${theme.icon}" class="w-4 h-4 mt-0.5 shrink-0"></i><span class="leading-snug">${esc(message)}</span>`;
  root.appendChild(el);
  if(window.lucide) lucide.createIcons({nodes:[el]});
  setTimeout(()=>{ el.style.transition='opacity .25s ease, transform .25s ease'; el.style.opacity='0'; el.style.transform='translateY(6px)'; setTimeout(()=>el.remove(), 260); }, 3400);
}

let _confirmResolver = null;
function askConfirm(title, message, confirmLabel, danger){
  return new Promise((resolve)=>{
    _confirmResolver = resolve;
    UI.confirmDialog = {title, message, confirmLabel:confirmLabel||'Confirmar', danger:!!danger};

  });
}
function resolveConfirm(value){ UI.confirmDialog=null; renderConfirmDialog(); if(_confirmResolver){ _confirmResolver(value); _confirmResolver=null; } }

function wireAutouppercase(){
  document.querySelectorAll('[data-uppercase="true"]').forEach(el=>{
    if(!el._ucWired){
      el._ucWired = true;
      el.addEventListener('input', ()=>{
        const start = el.selectionStart, end = el.selectionEnd;
        el.value = el.value.toUpperCase();
        try{ el.setSelectionRange(start, end); }catch(e){}
      });
      if(el.value) el.value = el.value.toUpperCase();
    }
  });
}

/* =========================================================================
   UTILIDADES DE NEGOCIO Y FECHAS
   ========================================================================= */
function txInRange(transactions, fromDate, toDate){
  return transactions.filter(t=>{
    const d = getLocalYYYYMMDD(t.fecha);
    return d >= fromDate && d <= toDate;
  });
}
function sumByType(list, type){ return list.filter(t=>t.tipo===type).reduce((s,t)=>s+Number(t.total||0),0); }
function getLowStock(products){ return products.filter(p=>parseFloat(p.stock)<=parseFloat(p.stock_min)).sort((a,b)=>a.stock-b.stock); }
function rangeForFilter(filter){
  const today = todayStr();
  if(filter==='hoy') return [today, today];
  if(filter==='semana'){
    const d = new Date(); d.setDate(d.getDate()-6);
    const from = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    return [from, today];
  }
  if(filter==='mes'){
    const d = new Date(); d.setDate(d.getDate()-29);
    const from = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    return [from, today];
  }
  return ['0000-00-00','9999-99-99'];
}

function composeLocalSummary(m){
  const {date,totalSales,totalCostOfSales,totalExpenses,netProfit,salesCount,topProducts,lowStockAlerts} = m;
  const grossMargin = totalSales>0 ? ((totalSales-totalCostOfSales)/totalSales*100) : 0;
  const p = [];
  if(salesCount===0){
    p.push(`El día ${fmtDateShort(date)} no registró ventas. Los gastos del día sumaron ${fmtUSD(totalExpenses)}.`);
  } else {
    p.push(`El día ${fmtDateShort(date)} se registraron ${salesCount} venta(s) por ${fmtUSD(totalSales)} (${fmtBs(Rate.toBs(totalSales))}), con costo de ${fmtUSD(totalCostOfSales)}. Margen bruto: ${grossMargin.toFixed(1)}%.`);
  }
  if(totalExpenses>0){
    p.push(`Los gastos operativos del día ascendieron a ${fmtUSD(totalExpenses)}. ${netProfit>=0?'La utilidad neta se mantuvo positiva en '+fmtUSD(netProfit)+'.':'La utilidad neta resultó negativa en -'+fmtUSD(Math.abs(netProfit))+'. Revisar si fue un gasto puntual.'}`);
  } else if(salesCount>0){
    p.push(`Sin gastos operativos registrados. Utilidad neta: ${fmtUSD(netProfit)} (${fmtBs(Rate.toBs(netProfit))}).`);
  }
  if(topProducts&&topProducts.length){
    const top = topProducts[0];
    p.push(`Producto de mayor movimiento: [${top.codigo||'SKU'}] "${top.nombre}" con ${fmtQty(top.cantidad)} unidades (${fmtUSD(top.ingresos)}).${topProducts.length>1?' Le siguieron '+topProducts.slice(1,3).map(t=>`[${t.codigo||'SKU'}] "${t.nombre}"`).join(' y ')+'.':''}`);
  }
  if(lowStockAlerts&&lowStockAlerts.length){
    p.push(`Atención: ${lowStockAlerts.length} producto(s) en o por debajo del stock mínimo. Planificar reabastecimiento.`);
  } else {
    p.push('El inventario se encuentra en niveles saludables.');
  }
  return p.join('\n\n');
}

async function generateReport(dateStr){
  const transactions = DB.getTransactions().filter(t => getLocalYYYYMMDD(t.fecha) === dateStr);
  let totalSales=0, totalCostOfSales=0, totalExpenses=0;
  const salesCount = transactions.filter(t=>t.tipo==='venta').length;
  const itemMap = {};
  transactions.forEach(t=>{
    if(t.tipo==='venta'){
      totalSales += Number(t.total||0);
      (t.items||[]).forEach(it=>{
        totalCostOfSales += Number(it.costo||0) * Number(it.cantidad||0);
        const k = it.nombre;
        if(!itemMap[k]) itemMap[k] = {nombre:it.nombre, codigo:it.codigo||'', qty:0, rev:0};
        itemMap[k].qty += Number(it.cantidad||0);
        itemMap[k].rev += Number(it.precio||0)*Number(it.cantidad||0);
      });
    } else if(t.tipo==='gasto'){ totalExpenses += Number(t.total||0); }
  });
  const netProfit = totalSales - totalCostOfSales - totalExpenses;
  const topProducts = Object.values(itemMap).map(d=>({nombre:d.nombre,codigo:d.codigo,cantidad:d.qty,ingresos:d.rev})).sort((a,b)=>b.cantidad-a.cantidad).slice(0,5);
  const lowStockAlerts = getLowStock(DB.getProducts()).map(p=>`[${p.codigo}] ${p.nombre} (stock:${fmtQty(p.stock)}/mín:${fmtQty(p.stock_min)})`);
  const metrics = {date:dateStr,totalSales,totalCostOfSales,totalExpenses,netProfit,salesCount,topProducts,lowStockAlerts};
  let summary = composeLocalSummary(metrics);
  let source = 'local';

  if(DB.getConfig('gemini_api_key','')){
    try{
      const ai = await withTimeout(callGeminiReportSummary(metrics), 9000);
      if(ai){ summary=ai; source='gemini'; }
    }catch(e){ console.warn('IA no disponible, usando resumen local.', e); }
  }

  return await DB.saveReport({
    id:dateStr, fecha:dateStr, total_ventas:totalSales, total_costo_ventas:totalCostOfSales,
    total_gastos:totalExpenses, utilidad_neta:netProfit, num_ventas:salesCount,
    top_productos:topProducts, resumen:summary, fuente_resumen:source
  });
}

function withTimeout(promise, ms){
  return Promise.race([promise, new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),ms))]);
}

function triggerAutoCodeGen() {
  const catInput = document.getElementById('product-cat-input');
  const nameInput = document.getElementById('product-name-input');
  const codeInput = document.getElementById('product-code-input');
  if(!catInput || !nameInput || !codeInput) return;

  const cat = catInput.value.trim();
  const name = nameInput.value.trim();
  const generated = generateProductCode(cat, name);
  codeInput.value = generated;
  toast(`Código generado (máx 6): ${generated}`, 'info');
}

/* ---- Venta: búsqueda de productos (código o nombre) y carrito de artículos ---- */
function searchSaleProducts(query){
  const q = normalize(query);
  if(!q) return [];
  return DB.getProducts().filter(p=>{
    if(parseFloat(p.stock)<=0) return false;
    return normalize(p.codigo).includes(q) || normalize(p.nombre).includes(q);
  }).slice(0,8);
}
function renderSaleSuggestionsHTML(list){
  if(!list.length) return '';
  return list.map(p=>`
    <button type="button" data-suggest-id="${esc(p.id)}" class="w-full text-left flex items-center justify-between gap-2 px-3 py-2 rounded-lg bg-white/5 hover:bg-amber-500/15 border border-transparent hover:border-amber-500/30 transition-colors">
      <span class="min-w-0 truncate text-xs text-slate-200"><span class="font-mono-num font-bold text-amber-300">[${esc(p.codigo)}]</span> ${esc(p.nombre)}</span>
      <span class="text-[11px] font-mono-num text-slate-400 shrink-0">${fmtUSD(p.precio)} · ${fmtQty(p.stock)}u.</span>
    </button>`).join('');
}
function renderSaleCartHTML(cart){
  if(!cart || !cart.length) return `<div class="text-center py-4 px-3 text-xs text-slate-500 border border-dashed border-slate-700 rounded-xl">Aún no has agregado artículos. Busca arriba por código, nombre o usa el micrófono.</div>`;
  return cart.map((it,idx)=>{
    const lineTotal = it.precio*it.cantidad;
    const over = it.cantidad > it.stock;
    return `
    <div class="flex items-center gap-2 bg-white/5 rounded-xl px-3 py-2 ${over?'ring-1 ring-red-500/50':''}">
      <div class="min-w-0 flex-1">
        <p class="text-sm text-white font-medium truncate">[${esc(it.codigo)}] ${esc(it.nombre)}</p>
        <p class="text-[11px] font-mono-num ${over?'text-red-400':'text-slate-500'}">${fmtUSD(it.precio)} c/u · stock ${fmtQty(it.stock)}${over?' · excede stock':''}</p>
      </div>
      <input type="number" min="0.01" step="0.01" value="${it.cantidad}" data-cart-qty="${idx}" class="w-16 bg-ink-800/70 border border-slate-700 rounded-lg px-1.5 py-1.5 text-xs text-white font-mono-num text-center focus:border-amber-500 shrink-0" />
      <span class="text-xs font-bold font-mono-num text-emerald-300 w-16 text-right shrink-0">${fmtUSD(lineTotal)}</span>
      <button type="button" data-cart-remove="${idx}" class="w-7 h-7 flex items-center justify-center rounded-lg text-slate-500 hover:text-red-300 hover:bg-red-500/10 transition-colors shrink-0" title="Quitar artículo"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
    </div>`;
  }).join('');
}
function addToSaleCart(productId){
  const p = DB.getProducts().find(x=>x.id===productId);
  if(!p || !UI.modal || !UI.modal.cart) return;
  if(parseFloat(p.stock)<=0){ toast('Ese producto no tiene stock disponible.','error'); return; }
  const existing = UI.modal.cart.find(it=>it.productId===productId);
  if(existing){ existing.cantidad = parseFloat((existing.cantidad+1).toFixed(2)); }
  else { UI.modal.cart.push({productId:p.id, codigo:p.codigo, nombre:p.nombre, precio:parseFloat(p.precio)||0, costo:parseFloat(p.costo)||0, stock:parseFloat(p.stock)||0, cantidad:1}); }
  const input = document.getElementById('sale-search-input');
  const box = document.getElementById('sale-suggestions');
  if(input) input.value='';
  if(box) box.innerHTML='';
  refreshSaleCartUI();
}
function removeFromSaleCart(idx){
  if(!UI.modal || !UI.modal.cart) return;
  UI.modal.cart.splice(idx,1);
  refreshSaleCartUI();
}
function updateSaleCartQty(idx, value){
  if(!UI.modal || !UI.modal.cart) return;
  const it = UI.modal.cart[idx];
  if(!it) return;
  let q = parseFloat(value);
  if(isNaN(q) || q<=0) q = 0.01;
  it.cantidad = q;
  refreshSaleCartUI(true);
}
function refreshSaleCartUI(skipListRerender){
  if(!skipListRerender){
    const cartBox = document.getElementById('sale-cart');
    if(cartBox){ cartBox.innerHTML = renderSaleCartHTML(UI.modal.cart||[]); if(window.lucide) lucide.createIcons({nodes:[cartBox]}); }
  }
  const preview = document.getElementById('sale-total-preview');
  const cart = (UI.modal && UI.modal.cart) || [];
  if(preview){
    const total = cart.reduce((s,it)=>s+it.precio*it.cantidad,0);
    const overStock = cart.some(it=>it.cantidad>it.stock);
    preview.textContent = cart.length ? `${fmtUSD(total)} · ${fmtBs(Rate.toBs(total))}` : '—';
    preview.classList.toggle('text-red-400', overStock);
    preview.classList.toggle('text-emerald-300', !overStock);
  }
}

/* ---- Venta: búsqueda de productos por voz (mismo motor de reconocimiento que el asistente) ---- */
let saleSearchRecognition = null;
let saleSearchListening = false;
function setupSaleSearchRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  const rec = new SR();
  rec.continuous = false;
  rec.interimResults = false;
  rec.lang = 'es-VE';
  rec.onstart = ()=>{ saleSearchListening=true; updateSaleMicUI(); };
  rec.onerror = ()=>{ saleSearchListening=false; updateSaleMicUI(); };
  rec.onend = ()=>{ saleSearchListening=false; updateSaleMicUI(); };
  rec.onresult = (e)=>{
    let text='';
    for(let i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal) text += e.results[i][0].transcript; }
    text = text.trim();
    if(!text) return;
    const input = document.getElementById('sale-search-input');
    const box = document.getElementById('sale-suggestions');
    if(input) input.value = text;
    if(box) box.innerHTML = renderSaleSuggestionsHTML(searchSaleProducts(text));
  };
  return rec;
}
function toggleSaleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Tu navegador no soporta dictado por voz. Usa Google Chrome.','error'); return; }
  if(!saleSearchRecognition) saleSearchRecognition = setupSaleSearchRecognition();
  if(!saleSearchRecognition) return;
  if(saleSearchListening){ try{ saleSearchRecognition.stop(); }catch(e){} }
  else { try{ saleSearchRecognition.start(); }catch(e){ console.error(e); toast('No se pudo iniciar el micrófono: '+e.message,'error'); } }
}
function updateSaleMicUI(){
  const btn = document.getElementById('sale-mic-btn');
  if(!btn) return;
  btn.classList.toggle('bg-red-500/20', saleSearchListening);
  btn.classList.toggle('text-red-300', saleSearchListening);
  btn.classList.toggle('bg-sky-500/15', !saleSearchListening);
  btn.classList.toggle('text-sky-300', !saleSearchListening);
  btn.innerHTML = `<i data-lucide="${saleSearchListening?'mic-off':'mic'}" class="w-4 h-4"></i>`;
  if(window.lucide) lucide.createIcons({nodes:[btn]});
}
